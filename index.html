<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 단어장</title>
<meta name="description" content="영어 학습지 단어를 페이지별로 연습하는 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Young+Serif&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow study column (max 560px) — a navy title card on top, white choice tiles, then one exercise at a time. */
:root{
  --paper:#f3f4f8; --surface:#ffffff; --ink:#151a33; --muted:#5d6380; --line:#dcdfea;
  --navy:#1b2550; --navy-fg:#f3f4f8; --mark:#ffd84a; --mark-ink:#2a2200;
  --good:#1f8a5b; --good-bg:#e3f4ec; --bad:#c2413a; --bad-bg:#fbe7e5;
  --c1-bg:#2b54d6; --c1-fg:#ffffff; --c1-line:#2b54d6;
  --c2-bg:#0f7f5a; --c2-fg:#ffffff; --c2-line:#0f7f5a;
  --c3-bg:#b85400; --c3-fg:#ffffff; --c3-line:#b85400;
  --c4-bg:#c2255c; --c4-fg:#ffffff; --c4-line:#c2255c;
  --c5-bg:#6a3fd1; --c5-fg:#ffffff; --c5-line:#6a3fd1;
  --c6-bg:#0b7480; --c6-fg:#ffffff; --c6-line:#0b7480;
  --f-word:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1222; --surface:#181c33; --ink:#eceef7; --muted:#9aa0bd; --line:#2b3150;
  --navy:#232e66; --navy-fg:#f3f4f8; --mark:#f5cf3d; --mark-ink:#241d00;
  --good:#5fd19c; --good-bg:#16332a; --bad:#ff8a80; --bad-bg:#3a1d1f;
  --c1-bg:#2b54d6; --c1-fg:#ffffff; --c1-line:#2b54d6;
  --c2-bg:#0f7f5a; --c2-fg:#ffffff; --c2-line:#0f7f5a;
  --c3-bg:#b85400; --c3-fg:#ffffff; --c3-line:#b85400;
  --c4-bg:#c2255c; --c4-fg:#ffffff; --c4-line:#c2255c;
  --c5-bg:#6a3fd1; --c5-fg:#ffffff; --c5-line:#6a3fd1;
  --c6-bg:#0b7480; --c6-fg:#ffffff; --c6-line:#0b7480;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1222; --surface:#181c33; --ink:#eceef7; --muted:#9aa0bd; --line:#2b3150;
  --navy:#232e66; --navy-fg:#f3f4f8; --mark:#f5cf3d; --mark-ink:#241d00;
  --good:#5fd19c; --good-bg:#16332a; --bad:#ff8a80; --bad-bg:#3a1d1f;
  --c1-bg:#2b54d6; --c1-fg:#ffffff; --c1-line:#2b54d6;
  --c2-bg:#0f7f5a; --c2-fg:#ffffff; --c2-line:#0f7f5a;
  --c3-bg:#b85400; --c3-fg:#ffffff; --c3-line:#b85400;
  --c4-bg:#c2255c; --c4-fg:#ffffff; --c4-line:#c2255c;
  --c5-bg:#6a3fd1; --c5-fg:#ffffff; --c5-line:#6a3fd1;
  --c6-bg:#0b7480; --c6-fg:#ffffff; --c6-line:#0b7480;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* set card */
.setcard{background:var(--navy);color:var(--navy-fg);border-radius:18px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px}
.setcard .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.setcard h1{font-size:28px;font-weight:700}
.setcard .meta{font-size:14px;opacity:.8}
/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--ink);transform:translateY(-1px)}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
/* list */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.wl li:first-child{border-top:0}
.wl .en{font-family:var(--f-word);font-size:18px;min-width:0;overflow-wrap:anywhere}
.wl .ko{grid-column:1;color:var(--muted);font-size:14px;min-width:0}
.wl.hideko .ko{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.wl.hideko li.peek .ko{color:var(--muted);background:none}
.wl .say{grid-row:1/3;grid-column:2}
.say{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}
.say svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.mark{background:var(--mark);color:var(--mark-ink)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45;cursor:default}
/* exercise */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark);transition:width .25s}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:240px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%}
.card .big{font-family:var(--f-word);font-size:clamp(28px,8vw,40px);line-height:1.2;overflow-wrap:anywhere}
.card .ko{font-size:20px;font-weight:500}
.card .hint{font-size:13px;color:var(--muted)}
button.card{cursor:pointer}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:15px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.ok{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.choice.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.answer{width:100%;font:inherit;font-family:var(--f-word);font-size:22px;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.answer.ok{border-color:var(--good)} .answer.no{border-color:var(--bad)}
.feedback{min-height:22px;font-weight:700;text-align:center}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
/* result */
.score{font-family:var(--f-word);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
/* maker */
label{font-weight:700;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:260px;resize:vertical;font-size:14px;line-height:1.6}
.help{font-size:13px;color:var(--muted);margin:0}
.parsed{font-size:13px;color:var(--muted)}
.parsed b{color:var(--ink)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}
.qrcard{background:var(--navy);border-radius:16px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.qrcard .qt{color:var(--navy-fg);font-weight:700;font-size:18px}
.qrcard .qi{background:#fff;border-radius:10px;padding:10px;line-height:0;max-width:100%}
.qrcard .qi svg{width:240px;height:240px;max-width:100%}
.urlbox{width:100%;font-size:12px;color:var(--muted);word-break:break-all;max-height:64px;overflow:auto;background:var(--paper);border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.sample{font-size:12px;font-weight:700;background:var(--mark);color:var(--mark-ink);border-radius:6px;padding:2px 8px;align-self:flex-start}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .12s;min-width:0}
.page:hover{border-color:var(--ink);transform:translateY(-1px)}
.page .pn{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.page b{font-size:22px;font-variant-numeric:tabular-nums}
.page .pc{font-size:13px;color:var(--muted)}
.page .best{font-size:12px;color:var(--good);font-weight:700}
.note{font-size:13px;color:var(--muted)}
.wl .note{grid-column:1}
.wl.hideko .note{visibility:hidden}
.wl.hideko li.peek .note{visibility:visible}
.card .note{font-size:14px}
.section-label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.foot{display:flex;justify-content:center;padding-top:8px}
/* accounts & records */
.muted{color:var(--muted);font-weight:400}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.userbar .link{padding:2px 0}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.form{padding:18px;display:flex;flex-direction:column;gap:14px}
input[type=password]{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
#flt{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.empty{padding:18px;color:var(--muted);font-size:14px}
.wl .cnt{grid-row:1;grid-column:2;font-size:13px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:2px 8px;justify-self:end}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.log li:first-child{border-top:0}
.log li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.log li b{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:700;background:var(--paper)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.en{font-family:var(--f-word)}
tbody tr[data-sid]{cursor:pointer}
tbody tr[data-sid]:hover,tbody tr[data-sid]:focus-visible{background:var(--paper)}
tr.event td{color:var(--muted)}
.chip{font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:5px;padding:1px 6px}
.savestate{font-size:13px;font-weight:700;color:var(--muted)}
.savestate.ok{color:var(--good)}
.btn.danger{background:var(--bad);color:#fff}
.detail{padding:18px;display:flex;flex-direction:column;gap:12px}
.detail .wl li,.detail .log li{padding-inline:0}
.reset{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){.stat b{font-size:20px}.log li{grid-template-columns:1fr auto}.log li span:first-child{grid-column:1/-1}}

/* practice modes v2 */
.tab .tc{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .tc{color:var(--ink)}
.mode:disabled{opacity:.45;cursor:default;transform:none}
.mode:disabled:hover{border-color:var(--line)}
.modes .mode:nth-child(n){min-width:0}
.center{justify-content:center}
.row.small{gap:8px}
.toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flip{position:relative;perspective:1200px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none}
.flip:focus-visible .face{outline:3px solid var(--mark);outline-offset:2px}
.flip-in{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.flip-in.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px 34px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.face.back .note{color:var(--navy-fg);opacity:.75}
.face .no{position:absolute;top:14px;left:18px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.face.back .no{color:var(--navy-fg);opacity:.7}
.face .hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted)}
.face .big{font-family:var(--f-word);font-size:clamp(30px,9vw,44px);line-height:1.15;overflow-wrap:anywhere}
.big-ko{font-size:clamp(20px,6vw,26px)!important;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.star{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center;z-index:2;border-radius:50%}
.star svg{width:24px;height:24px}
.star.on{color:#e0a800}
.flip-in.on ~ .star{color:var(--navy-fg)}
.flip-in.on ~ .star.on{color:var(--mark)}
.choice.en{font-family:var(--f-word);font-size:18px}
.mask{font-family:var(--f-word);font-size:22px;letter-spacing:.06em;color:var(--muted);overflow-wrap:anywhere}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;transition:color .2s}
.timer.pen{color:var(--bad)}
.match{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px}
.tile{min-height:84px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 6px;font-size:14px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;word-break:keep-all;transition:transform .12s,background .15s,opacity .25s;min-width:0}
.tile.en{font-family:var(--f-word);font-weight:400;font-size:15px}
.tile.sel{border-color:var(--ink);background:var(--mark);color:var(--mark-ink);transform:scale(1.03)}
.tile.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.tile.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.tile.gone{opacity:0;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.done{font-size:13px;grid-column:2;grid-row:2/4;align-self:center}
@media (max-width:380px){.tile{font-size:13px;min-height:76px}.tile.en{font-size:14px}}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}.tile.no{animation:none}}

/* related words */
.wl .rels{grid-column:1;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-width:0}
.rel b{font-size:11px;font-weight:700;color:var(--ink);background:var(--line);border-radius:5px;padding:1px 6px;margin-right:4px}
.rel-en{font-family:var(--f-word);color:var(--ink);font-size:14px}
.wl.hideko .rels{visibility:hidden}
.wl.hideko li.peek .rels{visibility:visible}
.face .rels{display:flex;flex-direction:column;gap:4px;font-size:13px;opacity:.85;align-items:center}
.face.back .rel b{background:rgb(255 255 255 / .16);color:var(--navy-fg)}
.face.back .rel-en{color:var(--navy-fg)}
.tag{font-size:12px;font-weight:700;color:var(--muted);background:var(--line);border-radius:6px;padding:2px 8px}
.face.back .tag{background:rgb(255 255 255 / .16);color:var(--navy-fg)}

/* speech availability */
.speechbar{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--bad-bg);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink)}
.speechbar .muted{font-size:13px}
.btn.small{padding:8px 14px;font-size:13px;text-decoration:none}
.say.off{opacity:.4}

/* passages */
.setlist{list-style:none;margin:0;padding:0}
.setlist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.setlist li:first-child{border-top:0}
.sl-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.small{font-size:12px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.iconbtn:disabled{opacity:.35}
.upload{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--surface);font-weight:400}
.upload:hover{border-color:var(--ink)}
.upload input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload{position:relative}
.upload:focus-within{outline:3px solid var(--mark);outline-offset:2px}
.up-icon{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center;flex:none}
.up-icon svg{width:22px;height:22px}
.badlines{background:var(--bad-bg);border-radius:10px;padding:10px 14px;font-size:13px}
.badlines ul{margin:6px 0 0;padding-left:18px}

/* colour-coded choice tiles: each option gets its own hue so options never look like the title */
.c1{--t-bg:var(--c1-bg);--t-fg:var(--c1-fg);--t-line:var(--c1-line)}
.c2{--t-bg:var(--c2-bg);--t-fg:var(--c2-fg);--t-line:var(--c2-line)}
.c3{--t-bg:var(--c3-bg);--t-fg:var(--c3-fg);--t-line:var(--c3-line)}
.c4{--t-bg:var(--c4-bg);--t-fg:var(--c4-fg);--t-line:var(--c4-line)}
.c5{--t-bg:var(--c5-bg);--t-fg:var(--c5-fg);--t-line:var(--c5-line)}
.c6{--t-bg:var(--c6-bg);--t-fg:var(--c6-fg);--t-line:var(--c6-line)}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="lib/lz-string.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="config.js"></script>
<script src="words.js"></script>
<script>
const BASE_URL = "";  // 비워 두면 지금 접속한 주소를 그대로 씁니다
const BOOK = window.WORD_BOOK || "교과서";            // name of the built-in list (words.js) on the first screen
const SITE_NAME = window.WORD_SITE || "영어 단어장";  // the name at the top of every screen
const PAGES = window.WORD_PAGES || [];
/* each page keeps its head words (shown in the word list) and practises them together with their
   related words (synonyms, antonyms, derived forms from the 4th column of words.js) */
function relWord(h, r, pid){
  const w = [r[1], r[0] === '유의어' ? h[1] : (r[2] || ''), `${r[0]} · ${h[0]}`];
  w.pid = pid; w.rel = r[0]; w.head = h; return w;
}
PAGES.forEach(p => {
  p.heads = p.w;
  p.heads.forEach(w => { w.pid = p.id; });
  p.w = p.heads.flatMap(h => [h, ...(Array.isArray(h[3]) ? h[3] : []).map(r => relWord(h, r, p.id)).filter(w => w[1])]);
});
const ALL = {id: 'all', t: '전체 페이지', heads: PAGES.flatMap(p => p.heads), w: PAGES.flatMap(p => p.w)};
const countLine = set => set.heads && set.w.length > set.heads.length ? `단어 ${set.heads.length}개 · 관련어 ${set.w.length - set.heads.length}개` : `${set.w.length}개 단어`;

const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }
let VIEWSEQ = 0;   // lets a slow answer know whether its screen is still showing
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* answer key: drop symbols and structure markers that are not typed ("~", "…", "+ 결과", "+O+O.C.") */
const plain = en => en.replace(/\+.*$/, '').replace(/[~…()]/g, ' ').replace(/[가-힣]/g, '').replace(/\s+/g, ' ').trim();
const norm = s => plain(s).toLowerCase().replace(/[’`]/g, "'").replace(/\s*-\s*/g, '-');
const spoken = en => plain(en).replace(/\bto-v\b/g, 'to do').replace(/\bA\b/g, 'A');

/* ---------- link encoding for teacher-made sets (#w…) ---------- */
function b64url(u8){ let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function valid(j){ return j && Array.isArray(j.w) && j.w.length ? {id: 'custom', t: String(j.t || '단어장'), w: j.w.filter(p => Array.isArray(p) && p[0]).map(p => [String(p[0]).trim(), String(p[1] || '').trim(), String(p[2] || '').trim()])} : null; }
function encodeSet(set){ return 'w' + b64url(LZString.compressToUint8Array(JSON.stringify({t: set.t, w: set.w.map(p => p[2] ? p : [p[0], p[1]])}))); }
function decodeToken(tok){ try { return valid(JSON.parse(LZString.decompressFromUint8Array(unb64url(tok.slice(1))))); } catch(e){ return null; } }
function decodeOldLink(text){
  const m = text.match(/#p=([A-Za-z0-9+\-$]+)/); if (!m) return null;
  try { return valid(JSON.parse(LZString.decompressFromEncodedURIComponent(m[1]))); } catch(e){ return null; }
}
const base = () => (BASE_URL || location.href).split('#')[0];

/* ---------- speech ----------
   Phones need care: in-app browsers (KakaoTalk, Naver on Android) have no speech at all, iPhone stays
   silent until speech is started once from a tap, and cancelling right before speaking drops the new
   utterance on some phones. */
const synth = window.speechSynthesis;
const canSpeak = !!(synth && window.SpeechSynthesisUtterance);
let voices = [];
function loadVoices(){ try { voices = synth.getVoices() || []; } catch(e){ voices = []; } }
if (canSpeak) { loadVoices(); try { synth.addEventListener('voiceschanged', loadVoices); } catch(e){ synth.onvoiceschanged = loadVoices; } }
const pickVoice = () => voices.find(v => /^en[-_]US/i.test(v.lang) && v.localService) || voices.find(v => /^en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
let unlocked = false;
function unlockSpeech(e){
  if (unlocked || !canSpeak) return; unlocked = true;
  // a first tap that already speaks unlocks by itself; a silent warm-up there would be cancelled and could swallow the word
  if (e && e.target && e.target.closest && e.target.closest('[data-say], #say, .tile.en, .choice, #t-auto')) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch(e){}
}
['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockSpeech, {capture: true, once: true}));
const IN_APP = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(navigator.userAgent);
const IS_KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
let noSpeechShown = false;
function noSpeechNotice(){
  toast(IN_APP ? '앱 안의 브라우저에서는 발음이 안 나와요. 크롬이나 사파리로 열어 주세요.' : '이 브라우저는 발음 듣기를 지원하지 않아요. 크롬이나 사파리로 열어 주세요.');
}
function speak(text){
  if (!canSpeak) { if (!noSpeechShown) { noSpeechShown = true; noSpeechNotice(); } return; }
  try {
    if (synth.speaking || synth.pending) synth.cancel();
    if (synth.paused) synth.resume();
    const u = new SpeechSynthesisUtterance(spoken(text));
    u.lang = 'en-US'; u.rate = .9;
    const v = pickVoice(); if (v) u.voice = v;
    synth.speak(u);
  } catch(e){}
}
/* shown on the page picker and set home when this browser cannot speak */
function speechBanner(){
  if (canSpeak) return '';
  const url = location.href;
  return `<div class="speechbar"><span>${IN_APP ? '지금 앱 안의 브라우저로 열려 있어서 발음 듣기가 안 돼요.' : '이 브라우저에서는 발음 듣기가 안 돼요.'} 크롬이나 사파리로 열면 들을 수 있어요.</span>
    ${IS_KAKAO ? `<a class="btn mark small" href="kakaotalk://web/openExternal?url=${encodeURIComponent(url)}">다른 브라우저로 열기</a>` : '<span class="muted">오른쪽 위 ⋮ 또는 공유 메뉴에서 "다른 브라우저로 열기"를 눌러요.</span>'}</div>`;
}
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = w => `<button class="say${canSpeak ? '' : ' off'}" data-say="${esc(w)}" aria-label="${esc(w)} 발음 듣기">${SPK}</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.stopPropagation(); speak(b.dataset.say); } }, true);

/* ---------- state ---------- */
let SET = null, origin = 'pages';   // origin: 'pages' (from the page picker) | 'link' (teacher-made link) | 'maker'
const header = right => `<div class="top"><div class="brand">${esc(SITE_NAME)}</div>${right || ''}</div>`;
/* related words beside a head word: "유의어 only, exclusively" / "반의어 trivial 사소한" */
function relHTML(w){
  const rel = Array.isArray(w[3]) ? w[3] : []; if (!rel.length) return '';
  const groups = [];
  rel.forEach(r => { let g = groups.find(x => x.type === r[0]); if (!g) groups.push(g = {type: r[0], items: []}); g.items.push(r); });
  return groups.map(g => `<span class="rel"><b>${esc(g.type)}</b> ${g.items.map(r => `<span class="rel-en">${esc(r[1])}</span>${r[2] && g.type !== '유의어' ? ' ' + esc(r[2]) : ''}`).join(', ')}</span>`).join('');
}
const wordRow = w => { const [en, ko, note] = w; const rel = relHTML(w);
  return `<li><span class="en">${esc(en)}</span>${sayBtn(en)}<span class="ko">${esc(ko)}</span>${rel ? `<span class="rels">${rel}</span>` : note ? `<span class="note">${esc(note)}</span>` : ''}</li>`; };
const lastKey = id => 'wordroom-last-' + (AUTH ? AUTH.sid + '-' : '') + id;

/* ---------- accounts & records (Google Sheets via Apps Script, see apps-script/Code.gs) ---------- */
const CFG = window.WORD_CONFIG || {};
const API = String(CFG.apiUrl || '').trim();
const ACCOUNTS = !!API;                                // records are on when a server is set
const LOGIN = ACCOUNTS && CFG.requireLogin !== false;  // login required before practice
let AUTH = store.get('wordroom-auth', null);           // {token, sid, name}
let ADMIN = store.get('wordroom-admin', null);         // {token, exp}

async function api(action, data){
  if (!API) throw {error: 'config.js에 서버 주소(apiUrl)가 아직 없어요.'};
  let res;
  try {
    const r = await fetch(API, {method: 'POST', keepalive: action === 'raceProgress', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action}, data || {}))});
    res = await r.json();
  } catch(e){ throw {error: '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.', offline: true}; }
  if (!res.ok) throw res;
  return res;
}
function setAuth(a){ AUTH = a; store.set('wordroom-auth', a); viewHome.synced = false; }
function logout(){ if (AUTH) store.set('wordroom-me-' + AUTH.sid, null); setAuth(null); LOGIN ? viewLogin(route) : route(); }   // a shared device keeps nothing of the last student
function onAuthError(e, retry){
  if (e && e.code === 'auth') { setAuth(null); toast('다시 로그인해 주세요'); viewLogin(retry || route); return true; }
  return false;
}

/* practice results go into a queue first, so a dropped connection never loses them */
const QKEY = 'wordroom-queue';
async function sendLog(entry){
  if (!API || !AUTH) return 'off';
  const q = store.get(QKEY, []); q.push(Object.assign({token: AUTH.token, sid: AUTH.sid, at: new Date().toISOString()}, entry)); store.set(QKEY, q.slice(-100));
  return flushQueue();
}
let flushing = null;
function flushQueue(){
  if (!API) return Promise.resolve('off');
  if (flushing) return flushing;
  flushing = (async () => {
    let q = store.get(QKEY, []), status = 'saved';
    while (q.length) {
      const item = q[0];
      if (!AUTH || item.sid !== AUTH.sid) { q.shift(); store.set(QKEY, q); continue; }   // another student's leftover on a shared device
      try { await api('log', Object.assign({}, item, {token: AUTH.token})); q.shift(); store.set(QKEY, q); }
      catch(e){ if (e.code === 'auth') { q.shift(); store.set(QKEY, q); status = 'auth'; } else { status = 'queued'; break; } }
    }
    return status;
  })().finally(() => { flushing = null; });
  return flushing;
}

function userBar(){
  if (!ACCOUNTS) return '';
  if (!AUTH) return `<div class="userbar"><span class="muted">로그인하면 내 기록과 오답이 저장돼요</span><button class="link" data-act="login">로그인</button></div>`;
  return `<div class="userbar"><span><b>${esc(AUTH.name)}</b> <span class="muted">${esc(AUTH.sid)}</span></span>
    <span class="row" style="gap:14px"><button class="link" data-act="me">내 기록</button><button class="link" data-act="logout">로그아웃</button></span></div>`;
}
function bindUserBar(){
  $app.querySelectorAll('[data-act=me]').forEach(b => b.onclick = viewMe);
  $app.querySelectorAll('[data-act=logout]').forEach(b => b.onclick = logout);
  $app.querySelectorAll('[data-act=login]').forEach(b => b.onclick = () => viewLogin(route));
}

/* ---------- login / first registration ---------- */
function viewLogin(next, startMode){
  stopTimers();
  let mode = startMode || 'login';
  const draw = (msg) => {
    if (mode === 'team') return drawTeam();
    $app.innerHTML = `${header()}
    <div class="setcard"><div class="eyebrow">단어 연습</div><h1>${mode === 'login' ? '로그인' : '처음 등록'}</h1>
      <div class="meta">${mode === 'login' ? '학번과 내가 정한 비밀번호로 들어와요.' : '처음 한 번만 학번, 이름, 비밀번호를 정해요.'}</div></div>
    ${loginTabs()}
    <form id="af" class="panel form" autocomplete="on" novalidate>
      <div class="field"><label for="a-sid">학번</label><input id="a-sid" type="text" inputmode="numeric" autocomplete="username" placeholder="예: 21201" value="${esc(store.get('wordroom-last-sid', ''))}"></div>
      ${mode === 'register' ? '<div class="field"><label for="a-name">이름</label><input id="a-name" type="text" autocomplete="name" placeholder="예: 홍길동"></div>' : ''}
      <div class="field"><label for="a-pw">비밀번호</label><input id="a-pw" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" placeholder="4자 이상"></div>
      ${mode === 'register' ? '<div class="field"><label for="a-pw2">비밀번호 확인</label><input id="a-pw2" type="password" autocomplete="new-password"></div><p class="help">비밀번호는 암호화해서 저장돼요. 잊어버리면 선생님께 초기화를 부탁하세요.</p>' : ''}
      <div class="feedback no" id="af-msg" role="alert">${esc(msg || '')}</div>
      <button type="submit" class="btn mark" id="af-go">${mode === 'login' ? '로그인' : '등록하고 시작하기'}</button>
    </form>`;
    $app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    const sidEl = document.getElementById('a-sid');
    (sidEl.value ? document.getElementById('a-pw') : sidEl).focus();
    document.getElementById('af').onsubmit = async e => {
      e.preventDefault();
      const v = id => (document.getElementById(id) || {}).value || '';
      const sid = v('a-sid').trim(), name = v('a-name').trim(), pw = v('a-pw');
      const say = m => { document.getElementById('af-msg').textContent = m; };
      if (!/^[0-9A-Za-z-]{2,20}$/.test(sid)) return say('학번을 확인해 주세요.');
      if (mode === 'register' && !name) return say('이름을 써 주세요.');
      if (pw.length < 4) return say('비밀번호는 4자 이상이에요.');
      if (mode === 'register' && pw !== v('a-pw2')) return say('비밀번호 확인이 달라요.');
      const go = document.getElementById('af-go'); go.disabled = true; go.textContent = '확인하는 중…'; say('');
      try {
        const r = await api(mode, {sid, name, pw, v: setsV()});
        applySets(r.setsPack);
        setAuth({token: r.token, sid: r.student.sid, name: r.student.name});
        store.set('wordroom-last-sid', r.student.sid);
        toast(mode === 'login' ? `${r.student.name}님, 반가워요` : '등록했어요');
        flushQueue(); next();
      } catch(err){ go.disabled = false; go.textContent = mode === 'login' ? '로그인' : '등록하고 시작하기'; say(err.error || '다시 시도해 주세요.'); }
    };
  };
  function loginTabs(){
    return `<div class="tabs" role="tablist">
      <button role="tab" class="tab" aria-selected="${mode === 'login'}" data-m="login">로그인</button>
      <button role="tab" class="tab" aria-selected="${mode === 'register'}" data-m="register">처음 등록</button>
      <button role="tab" class="tab" aria-selected="${mode === 'team'}" data-m="team">모둠 입장</button>
    </div>`;
  }
  let teamData = null, pickCls = store.get('wordroom-last-cls', ''), pickTeam = '';
  async function drawTeam(msg){
    $app.innerHTML = `${header()}
    <div class="setcard"><div class="eyebrow">모둠 레이스</div><h1>모둠 입장</h1><div class="meta">반을 고르고 우리 모둠을 골라요.</div></div>
    ${loginTabs()}
    <div class="panel form" id="tf">${teamData ? '' : '<div class="muted">반과 모둠을 불러오는 중…</div>'}</div>`;
    $app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    if (!teamData) {
      try { teamData = (await api('teams', {})).classes; }
      catch(e){ document.getElementById('tf').innerHTML = `<div class="feedback no">${esc(e.error || '불러오지 못했어요.')}</div>`; return; }
      if (mode !== 'team') return;
    }
    const box = document.getElementById('tf'); if (!box) return;
    if (!teamData.length) { box.innerHTML = '<div class="muted">아직 선생님이 반과 모둠을 등록하지 않았어요.</div>'; return; }
    if (!teamData.some(c => c.name === pickCls)) pickCls = '';
    const c = teamData.find(x => x.name === pickCls);
    box.innerHTML = `<div class="field"><span class="flabel">반</span><div class="pickgrid">${teamData.map(x => `<button type="button" class="pick${x.name === pickCls ? ' on' : ''}" data-pc="${esc(x.name)}">${esc(x.name)}</button>`).join('')}</div></div>
      ${c ? `<div class="field"><span class="flabel">모둠</span><div class="pickgrid">${c.teams.map(t => `<button type="button" class="pick${t === pickTeam ? ' on' : ''}" data-pt="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>` : ''}
      <div class="feedback no" id="tf-msg" role="alert">${esc(msg || '')}</div>
      <button type="button" class="btn mark" id="tf-go" ${c && pickTeam ? '' : 'disabled'}>${c && pickTeam ? `${esc(pickCls)} ${esc(pickTeam)}으로 입장` : '반과 모둠을 골라 주세요'}</button>`;
    box.querySelectorAll('[data-pc]').forEach(b => b.onclick = () => { pickCls = b.dataset.pc; pickTeam = ''; drawTeam(); });
    box.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { pickTeam = b.dataset.pt; drawTeam(); });
    document.getElementById('tf-go').onclick = async e => {
      e.target.disabled = true; e.target.textContent = '입장하는 중…';
      try {
        const r = await api('teamLogin', {cls: pickCls, team: pickTeam, v: setsV()});
        applySets(r.setsPack);
        setTeam({token: r.token, cls: r.team.cls, team: r.team.team, exp: Date.now() + 9.5 * 3600e3});
        store.set('wordroom-races-' + r.team.cls + '|' + r.team.team, {races: r.races, at: Date.now()});   // the race list arrives with the login
        store.set('wordroom-last-cls', pickCls);
        toast(`${pickCls} ${pickTeam}, 반가워요`);
        viewTeamHome();
      } catch(err){ drawTeam(err.error || '다시 시도해 주세요.'); }
    };
  }
  draw();
  scrollTo(0, 0);
}

/* ---------- my records ---------- */
const fmtTime = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('ko-KR', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}); };
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
function lookupWord(en, page){
  const p = PAGES.find(p => p.id === page) || SETS.find(s => s.id === page);
  return (p && p.w.find(w => w[0] === en)) || ALL.w.find(w => w[0] === en) || SETS.flatMap(s => s.w).find(w => w[0] === en) || [en, '', ''];
}
const pageName = id => id === 'all' ? '전체' : id === 'mywrong' ? '내 오답' : id === 'custom' ? '단어장' : ((PAGES.find(p => p.id === id) || SETS.find(s => s.id === id) || {}).t || id || '').replace('학습지 ', '');

async function viewMe(){
  if (TEAM) return viewTeamHome();
  if (!AUTH) return viewLogin(viewMe);
  $app.innerHTML = `${header('<button class="link" id="up">← 처음으로</button>')}${userBar()}<h2>내 기록</h2><div class="panel empty">기록을 불러오는 중…</div>`;
  document.getElementById('up').onclick = () => route(); bindUserBar();
  const mk = 'v-me-' + (++VIEWSEQ), ck = 'wordroom-me-' + AUTH.sid, cached = store.get(ck, null);
  $app.insertAdjacentHTML('beforeend', '<i hidden id="' + mk + '"></i>');
  if (cached) show(cached);
  await flushQueue();
  let r;
  try { r = await api('me', {token: AUTH.token}); }
  catch(e){ if (onAuthError(e, viewMe)) return; const el = $app.querySelector('.empty'); if (el && !cached) el.textContent = e.error || '기록을 불러오지 못했어요.'; return; }
  if (!document.getElementById(mk)) return;
  store.set(ck, r); show(r);
  return;
  function show(r){
  const MK = '<i hidden id="' + mk + '"></i>';

  const wrong = r.wrong.map(w => ({w: lookupWord(w.en, w.page), count: w.count, page: w.page, last: w.last}));
  $app.innerHTML = `${header('<button class="link" id="up">← 처음으로</button>')}${userBar()}
  <h2>내 기록</h2>
  <div class="stats">
    <div class="stat"><span>연습 횟수</span><b>${r.stats.sessions}</b></div>
    <div class="stat"><span>푼 문제</span><b>${r.stats.questions}</b></div>
    <div class="stat"><span>정답률</span><b>${pct(r.stats.correct, r.stats.questions)}</b></div>
  </div>
  <div class="section-label">자주 틀리는 단어</div>
  ${wrong.length ? `<button class="btn mark" id="drill">자주 틀린 단어 ${Math.min(20, wrong.length)}개로 연습하기</button>
    <div class="panel"><ul class="wl">${wrong.map(x => `<li><span class="en">${esc(x.w[0])}</span><span class="cnt">${x.count}번</span><span class="ko">${esc(x.w[1])}</span><span class="note">${esc(pageName(x.page))}${x.w[2] ? ' · ' + esc(x.w[2]) : ''}</span></li>`).join('')}</ul></div>`
    : '<div class="panel empty">아직 틀린 단어가 없어요. 뜻 고르기나 철자 쓰기를 해 보면 여기에 모여요.</div>'}
  <div class="section-label">최근 연습</div>
  ${r.recent.length ? `<div class="panel"><ul class="log">${r.recent.map(l => `<li><span>${esc(fmtTime(l.at))}</span><span>${esc(pageName(l.page) || l.pageTitle)} · ${esc(l.mode)}</span><b>${l.score}/${l.total}</b></li>`).join('')}</ul></div>`
    : '<div class="panel empty">아직 연습 기록이 없어요.</div>'}`;
  document.getElementById('up').onclick = () => route(); bindUserBar();
  const d = document.getElementById('drill');
  if (d) d.onclick = () => { SET = {id: 'mywrong', t: '내가 자주 틀린 단어', w: wrong.slice(0, 20).map(x => x.w).filter(w => w[1])}; origin = 'me'; viewHome(); };
  scrollTo(0, 0);

    $app.insertAdjacentHTML('beforeend', MK);
  }
}

  if (cached) { const f = $app.querySelector('#flt'); if (f && keep.filter) { f.value = keep.filter; f.dispatchEvent(new Event('input')); } scrollTo(0, keep.y); }
  return;
  function show(r){

/* ---------- word text → words: shared by the teacher's editor and by sets saved on the server ---------- */
/* "solely - 오로지, 단지 = only, exclusively" → ["solely", "오로지, 단지", "= only, exclusively"] */
function normMarkers(m){
  return String(m || '').replace(/\s*(=|↔)\s*/g, ' $1 ').replace(/(^|[\s,])(adv|[vna])\)\s*/g, '$1 $2) ').replace(/\s+/g, ' ').trim();
}
function splitMeaning(raw){
  let m = normMarkers(raw), note = '';
  const lead = m.match(/^= ([A-Za-z][A-Za-z ,'’-]*?) (?=[가-힣~(\[])/);
  if (lead) { note = '= ' + lead[1]; m = m.slice(lead[0].length); }
  m = m.replace(/^a\) /, '');
  const k = m.search(/ (=|↔|adv\)|[vna]\)) /);
  if (k >= 0) { note = (note + ' ' + m.slice(k + 1)).trim(); m = m.slice(0, k); }
  return [m.replace(/^[\s,;]+|[\s,;]+$/g, ''), note];
}
const REL_TYPE = {'=': '유의어', '↔': '반의어', 'v)': '동사', 'a)': '형용사', 'n)': '명사', 'adv)': '부사'};
/* note → related words, the same rules used to build words.js */
function relFromNote(note){
  const out = [];
  if (!note) return out;
  for (const part of normMarkers(note).split(/\s(?=(?:=|↔|adv\)|[vna]\))\s)/)) {
    const m = part.match(/^(=|↔|adv\)|[vna]\))\s+(.*)$/); if (!m) continue;
    const type = REL_TYPE[m[1]], rest = m[2].trim(); if (!rest) continue;
    if (type === '유의어') (/\(/.test(rest) ? [rest] : rest.split(/\s*,\s*/)).filter(Boolean).forEach(en => out.push([type, en]));
    else { const k = rest.search(/[가-힣~(\[]/); const en = (k > 0 ? rest.slice(0, k) : rest).trim(), ko = k > 0 ? rest.slice(k).trim() : ''; if (en && ko) out.push([type, en, ko]); }
  }
  return out;
}
/* one line per word: "영어 - 뜻", a tab, a colon, or just English then Korean */
function parseWordLine(line){
  line = line.trim().replace(/^\d+[.)]\s*/, '').replace(/^[-•·]\s*/, '');
  if (!line) return null;
  let en = '', rest = '';
  const tab = line.split('\t');
  if (tab.length >= 2) { en = tab[0]; rest = tab.slice(1).join(' '); }
  else {
    const k = line.search(/\s[-–—:|]\s|[:|]\s/);
    if (k > 0) { en = line.slice(0, k); rest = line.slice(k).replace(/^\s*[-–—:|]\s*/, ''); }
    else { const h = line.search(/[가-힣(~\[]/); if (h > 0) { en = line.slice(0, h); rest = line.slice(h); } }
  }
  en = en.replace(/[,\s]+$/, '').trim(); rest = rest.trim();
  if (!en || !rest || !/[A-Za-z]/.test(en)) return null;
  const [ko, note] = splitMeaning(rest);
  return ko ? (note ? [en, ko, note] : [en, ko]) : null;
}
function parseWordText(text){
  const words = [], bad = [];
  String(text || '').split(/\r?\n/).forEach(l => { if (!l.trim()) return; const w = parseWordLine(l); if (w) words.push(w); else bad.push(l.trim()); });
  return {words, bad};
}
/* a table copied from Excel or Google Sheets arrives as tab-separated rows (cells with line breaks are quoted).
   Turn it into "영어 - 뜻" lines: number cells and a header row are dropped, an English cell starts a word,
   the cells after it are its meaning, and a row may hold several word-meaning pairs side by side. */
function splitTSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = String(text).replace(/\r\n?/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === '') q = true;
    else if (ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function tableToLines(text){
  if (!/\t/.test(text)) return null;
  const isK = c => /[가-힣]/.test(c), isEn = c => /[A-Za-z]/.test(c) && !isK(c) && !/^(=|↔|adv\)|[vna]\))\s*/.test(c);
  const out = [];
  splitTSV(text).forEach(r => {
    const cells = r.map(c => c.trim().replace(/[,\s]*\n\s*/g, ', ').replace(/ /g, ' ').trim()).filter(c => c && !/^\(?\d{1,3}[.)]?$/.test(c));
    if (!cells.length || cells.every(c => HEADER_WORDS.test(c))) return;
    let cur = null;
    cells.forEach((c, k) => {
      const pairFollows = k + 1 < cells.length && !isEn(cells[k + 1]);
      if (isEn(c) && (!cur || (cur.ko.length && pairFollows))) { cur = {en: c, ko: []}; out.push(cur); }
      else if (cur) cur.ko.push(c);
      else out.push({en: '', ko: [c]});
    });
  });
  return out.map(x => x.en ? (x.ko.length ? `${x.en} - ${x.ko.join(' ')}` : x.en) : x.ko.join(' '));
}
const wordsToText = ws => ws.map(w => `${w[0]} - ${w[1]}${w[2] ? ' ' + w[2] : ''}`).join('\n');

/* photo text (OCR) → "영어 - 뜻" lines. A worksheet table comes back cell by cell or row by row,
   so read it as a stream: English words start an entry, Korean words are its meaning, and
   =, ↔, v), a), n), adv) start the related-word part that belongs to the same entry. */
const HEADER_WORDS = /^(단어|뜻|의미|번호|영어|우리말|한글|No\.?|word|words|meaning)$/i;
const isNumTok = t => /^\(?\d{1,3}[.)]?$/.test(t);
/* a table read column by column: all English cells, then all meaning cells → pair them in order */
function columnPairs(text){
  const lines = String(text || '').replace(/\u00a0/g, ' ').split(/\r?\n/).map(l => l.trim()).filter(Boolean)
    .filter(l => !HEADER_WORDS.test(l) && !/^\(?\d{1,3}[.)]?$/.test(l));
  const isK = l => /[가-힣]/.test(l), isMark = l => /^(=|↔|adv\)|[vna]\))\s/.test(normMarkers(l));
  let run = 0, maxRun = 0;
  lines.forEach(l => { if (!isK(l) && /[A-Za-z]/.test(l) && !isMark(l)) { run++; maxRun = Math.max(maxRun, run); } else run = 0; });
  if (maxRun < 3) return null;
  const en = [], ko = [];
  lines.forEach(l => {
    if (isK(l)) ko.push(l);
    else if (isMark(l) && ko.length) ko[ko.length - 1] += ' ' + l;   // "= only" under its meaning
    else if (/[A-Za-z]/.test(l)) en.push(l);
  });
  if (en.length < 3 || en.length !== ko.length) return null;
  return en.map((e, i) => `${e} - ${ko[i]}`);
}
function ocrToLines(text){
  const cols = columnPairs(text);
  if (cols) return cols;
  const isK = t => /[가-힣]/.test(t), isL = t => /[A-Za-z]/.test(t) && !isK(t);
  const MARK = /^(=|↔|adv\)|[vna]\))$/;
  const GLUE = /^(of|to|in|out|on|off|up|down|for|with|from|into|about|against|a|an|the|be|one’s|one's|~)$/i;
  const entries = []; let cur = null, state = 'none', noteKind = '', skip = false;
  const start = () => { cur = {en: [], ko: [], note: []}; entries.push(cur); state = 'en'; };
  String(text || '').replace(/ /g, ' ').split(/\r?\n/).forEach(line => {
    if (/^\s*(학습지|단원|과)?\s*\d+([\s~-]*\d+)?\s*(페이지|쪽|p\.?|번|단원|과)?\s*$/i.test(line) || /^\s*학습지/.test(line) || /^\s*(Lesson|Unit)\s*\d+/i.test(line)) { state = 'none'; return; }   // headings and page numbers
    const toks = normMarkers(line.replace(/\t/g, ' ')).split(' ').filter(t => t && !isNumTok(t) && !HEADER_WORDS.test(t));
    if (state === 'note') state = 'afternote';               // a line break ends a related-word part
    toks.forEach((t, i) => {
      const next = toks[i + 1] || '';
      if (MARK.test(t) && cur && (state === 'ko' || state === 'note' || state === 'afternote')) { state = 'note'; noteKind = t; cur.note.push(t); return; }
      if (state === 'note') {
        if (noteKind === '=' && isK(t)) {
          // "= only, exclusively suffering 고통": the words after the last comma were the next entry
          // take the last word, and keep extending while a small joining word ties it to the one before
          let j = cur.note.length - 1;
          while (j > 2 && !/,$/.test(cur.note[j - 1]) && isL(cur.note[j - 1]) && (GLUE.test(cur.note[j]) || GLUE.test(cur.note[j - 1]))) j--;
          if (j < 2) j = 2;                                    // the related part keeps at least one word
          const moved = cur.note.splice(j); start(); cur.en.push(...moved); state = 'ko'; cur.ko.push(t); return;
        }
        if (noteKind !== '=' && isL(t) && cur.note.some(isK)) { start(); cur.en.push(t); return; }
        // "n) presence spread 확산되다": a derived word with no meaning, then the next entry
        const last = cur.note[cur.note.length - 1];
        if (noteKind !== '=' && isL(t) && isL(last) && !MARK.test(last) && !GLUE.test(t) && !GLUE.test(last)) { start(); cur.en.push(t); return; }
        cur.note.push(t); return;
      }
      const koGlue = state === 'ko' && isK(next) && /^([A-Z][A-Z.]{0,4}|~|…)$/.test(t);   // "O를 O.C. 한", "~ 대신에"
      if (skip) { skip = false; return; }
      if (t === '~' && isK(next) && !/^~/.test(next) && cur && state === 'en' && cur.en.length) { state = 'ko'; cur.ko.push(t); return; }
      if (t === '+' && isK(next) && cur && state === 'en') { cur.en.push('+ ' + next); skip = true; return; }   // "result in + 결과"
      if (isK(t) || koGlue) {
        if (!cur || state === 'none') return;                // a heading such as "학습지 1페이지"
        state = 'ko'; cur.ko.push(t); return;
      }
      if (isL(t) || /^[~…+(\-]/.test(t)) {
        if (state === 'en') { cur.en.push(t); return; }
        start(); cur.en.push(t); return;
      }
      if (cur && state === 'ko') cur.ko.push(t);
      else if (cur && state === 'en') cur.en.push(t);
    });
  });
  return entries.filter(e => e.en.length && e.ko.length)
    .map(e => `${e.en.join(' ').replace(/\s*,$/, '')} - ${e.ko.join(' ')}${e.note.length ? ' ' + e.note.join(' ') : ''}`);
}

function toSet(s){

  return {id: s.id, t: s.name, kind: 'passage', heads, w: heads.flatMap(h => [h, ...(h[3] || []).map(r => relWord(h, r, s.id)).filter(x => x[1])])};
}
/* the server sends a short version with every passage bundle; words travel only when it changed */
const setsV = () => (SETS.length || store.get('wordroom-sets', null)) ? store.get('wordroom-sets-v', '') : '';
let setsFreshAt = 0;   // when the passages were last confirmed with the server
function applySets(pack){
  if (!pack) return false;

/* photo → smaller JPEG (long side 2000px) so it uploads quickly from a phone */
function shrinkImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 열 수 없어요. JPG나 PNG 사진으로 올려 주세요.')); };
    img.src = url;
  });
}

/* =====================================================================
   모둠 레이스: 선생님이 지문을 묶어 레이스를 열면, 반·모둠으로 입장해 한 번 달린다

let TEAM = store.get('wordroom-team', null);   // {token, cls, team, exp}
if (TEAM && !(TEAM.exp > Date.now())) { TEAM = null; store.set('wordroom-team', null); }
function setTeam(t){ TEAM = t; store.set('wordroom-team', t); }
function teamLeave(){ stopTimers(); setTeam(null); viewLogin(route, 'team'); }
const MODE_NAME = {time: '타임어택', match: '매칭 레이스', spell: '철자 레이스'};
const MODE_HELP = {time: '뜻 고르기와 단어 고르기가 섞여 나와요. 맞혀야 다음 문제로 넘어가요.', match: '단어와 뜻 8쌍씩 여러 판을 이어서 맞혀요.', spell: '뜻을 보고 영어로 써요. 각 단어의 첫 글자가 보여요.'};

/* every team gets the same words in the same order: shuffles are seeded by the race id */
function seededRng(seed){
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const seededShuffle = (a, rng) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function sourceWords(id, rel){
  const p = PAGES.find(x => x.id === id) || SETS.find(x => x.id === id);
  if (!p) return [];
  return rel ? p.w : (p.heads || p.w);
}
const sourceName = id => { const p = PAGES.find(x => x.id === id); if (p) return BOOK + ' ' + p.t.replace('학습지 ', ''); const s = SETS.find(x => x.id === id); return s ? s.t : '(지워진 지문)'; };
function raceWords(race){
  const seen = new Set(), out = [];
  (race.sources || []).forEach(id => sourceWords(id, race.settings.rel).forEach(w => { const k = w[0].toLowerCase(); if (!seen.has(k) && w[1]) { seen.add(k); out.push(w); } }));
  let list = seededShuffle(out, seededRng(race.id));
  if (race.settings.count > 0 && race.settings.count < list.length) list = list.slice(0, race.settings.count);
  return list;
}
/* matching rounds of up to 8 pairs, no repeated word or meaning inside a round */
function matchRounds(words){
  const rounds = []; let rest = words.slice();
  while (rest.length) {
    const r = [], en = new Set(), ko = new Set(), left = [];
    rest.forEach(w => { if (r.length < 8 && !en.has(w[0]) && !ko.has(w[1])) { r.push(w); en.add(w[0]); ko.add(w[1]); } else left.push(w); });
    rounds.push(r); rest = left;
  }
  return rounds;
}
const fmtSec = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return m ? `${m}분 ${r.toFixed(1).padStart(4, '0')}초` : `${r.toFixed(1)}초`; };

function viewRaceReady(race){

/* ---------- the race itself ---------- */
function runRace(race, words, st){
  stopTimers();
  const S = race.settings, P = S.penalty || 0, total = words.length;
  const t0 = performance.now() - (st.elapsed || 0) * 1000;
  const R = {done: st.done || 0, wrong: st.wrong || 0, penalty: st.penalty || 0, wrongWords: []};
  // the wait for "출발" counted on the server too, so a resumed race keeps the same clock
  const elapsed = () => (performance.now() - t0) / 1000 + R.penalty;
  // progress goes to the server at most every 2 seconds, and always once more after the last answer
  let lastSent = 0, sending = false, again = false, pending = null, finished = false;
  const push = () => {
    if (finished) return;
    if (sending) { again = true; return; }
    sending = true; lastSent = Date.now();
    api('raceProgress', {token: TEAM.token, race: race.id, done: R.done, wrong: R.wrong, penalty: R.penalty}).catch(() => {})
      .finally(() => { sending = false; if (again) { again = false; send(); } });
  };
  const send = force => {
    if (finished) return;
    const wait = 2000 - (Date.now() - lastSent);
    if (force || wait <= 0) { if (pending) { clearTimeout(pending); pending = null; } push(); }
    else if (!pending) { pending = setTimeout(() => { pending = null; push(); }, wait); timers.push(pending); }
  };
  const onHide = () => { if (document.visibilityState === 'hidden') send(true); };
  document.addEventListener('visibilitychange', onHide);
  timers.push({off: () => document.removeEventListener('visibilitychange', onHide)});
  const miss = w => { R.wrong++; R.penalty += P; if (w && !R.wrongWords.includes(w[0])) R.wrongWords.push(w[0]); const tm = document.getElementById('rtime'); if (tm && P) { tm.classList.add('pen'); setTimeout(() => tm.classList.remove('pen'), 450); } send(); };
  const top = () => `<div class="racehead"><div><div class="count">${esc(TEAM.cls)} · ${esc(TEAM.team)}</div><b>${esc(race.name)}</b></div><div class="rtime" id="rtime">${fmtSec(elapsed())}</div></div>
    <div class="bar"><i id="rbar" style="width:${total ? R.done / total * 100 : 0}%"></i></div><div class="count" id="rcount">${R.done} / ${total}${R.wrong ? ` · 틀림 ${R.wrong}` : ''}</div>`;
  const tick = setInterval(() => { const tm = document.getElementById('rtime'); if (tm) tm.textContent = fmtSec(elapsed()); }, 100); timers.push(tick);
  const prog = () => { const b = document.getElementById('rbar'), c = document.getElementById('rcount'); if (b) b.style.width = (R.done / total * 100) + '%'; if (c) c.textContent = `${R.done} / ${total}${R.wrong ? ` · 틀림 ${R.wrong}` : ''}`; };
  const finish = async () => {
    finished = true; stopTimers();
    $app.innerHTML = `<div class="countdown small">도착!</div><div class="panel empty" style="text-align:center">기록을 저장하는 중…</div>`;
    let r = null;
    for (let k = 0; k < 3 && !r; k++) { try { r = await api('raceFinish', {token: TEAM.token, race: race.id, done: R.done, wrong: R.wrong, penalty: R.penalty, wrongWords: R.wrongWords}); } catch(e){ if (e.code === 'auth') break; await new Promise(z => setTimeout(z, 1500)); } }
    viewRaceResult(race, r, R, elapsed());
  };

  if (S.mode === 'match') return matchRace();
  if (S.mode === 'spell') return spellRace();
  return timeRace();

  function timeRace(){
    const draw = () => {
      if (R.done >= total) return finish();
      const w = words[R.done], rng = seededRng(race.id + ':' + R.done), toKo = rng() < .5;
      const answer = toKo ? w[1] : w[0], seen = new Set([answer]), pick = [];
      for (const x of seededShuffle(words, rng)) { const t = toKo ? x[1] : x[0]; if (x !== w && x[1] !== w[1] && !seen.has(t)) { seen.add(t); pick.push(t); } if (pick.length === 3) break; }
      const opts = seededShuffle([answer, ...pick], rng);
      $app.innerHTML = `${top()}
      <div class="card" style="min-height:150px">${toKo ? `<div class="big">${esc(w[0])}</div><div class="hint">알맞은 뜻을 고르세요</div>` : `<div class="ko big-ko">${esc(w[1])}</div><div class="hint">알맞은 영어 단어를 고르세요</div>`}</div>
      <div class="choices">${opts.map((o, k) => `<button class="choice${toKo ? '' : ' en'}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
      $app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        if (opts[+b.dataset.k] === answer) {
          b.classList.add('ok'); $app.querySelectorAll('.choice').forEach(c => c.disabled = true);
          R.done++; prog(); send(); timers.push(setTimeout(draw, 250));
        } else { b.classList.add('no'); b.disabled = true; miss(w); prog(); }
      });
    };
    draw();
  }

  function spellRace(){
    const draw = () => {
      if (R.done >= total) return finish();
      const w = words[R.done], key = plain(w[0]); let extra = 0, tries = 0;
      const firsts = new Set(); key.replace(/[A-Za-z]+/g, (m, off) => { firsts.add(off); return m; });
      const mask = () => { let seen = 0; return key.split('').map((ch, k) => { if (!/[A-Za-z]/.test(ch)) return ch === ' ' ? ' ' : ch; seen++; return firsts.has(k) || seen <= extra + 1 ? ch : '_'; }).join(' '); };
      $app.innerHTML = `${top()}
      <div class="card" style="min-height:150px"><div class="ko big-ko">${esc(w[1])}</div><div class="mask" id="hn">${esc(mask())}</div></div>
      <form id="fm" class="row" style="flex-direction:column;align-items:stretch" autocomplete="off">
        <input class="answer" id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 쓰세요" aria-label="영어 답">
        <div class="feedback" id="fb"></div>
        <div class="row"><button type="button" class="btn ghost" id="skip">건너뛰기${P ? ` (+${P * 3}초)` : ''}</button><button type="submit" class="btn mark wide">확인</button></div>
      </form>`;
      const ans = document.getElementById('ans'), fb = document.getElementById('fb');
      timers.push(setTimeout(() => ans.focus(), 30));
      document.getElementById('fm').onsubmit = e => {
        e.preventDefault(); if (!ans.value.trim()) return;
        if (norm(ans.value) === norm(w[0])) { R.done++; prog(); send(); fb.className = 'feedback ok'; fb.textContent = '정답!'; timers.push(setTimeout(draw, 300)); return; }
        tries++; miss(w); prog();
        extra = Math.min(extra + 1, key.replace(/[^A-Za-z]/g, '').length - 1);
        document.getElementById('hn').textContent = mask();
        fb.className = 'feedback no'; fb.textContent = '다시 써 보세요. 한 글자를 더 보여 줄게요.';
        ans.classList.add('no'); setTimeout(() => ans.classList.remove('no'), 400); ans.select();
      };
      document.getElementById('skip').onclick = () => {
        R.wrong++; R.penalty += P * 3; if (!R.wrongWords.includes(w[0])) R.wrongWords.push(w[0]);
        fb.className = 'feedback no'; fb.innerHTML = `정답: <span style="font-family:var(--f-word)">${esc(w[0])}</span>`;
        R.done++; prog(); send(); timers.push(setTimeout(draw, 1300));
      };
    };
    draw();
  }

  function matchRace(){
    const rounds = matchRounds(words);
    let ri = 0, before = 0;
    while (ri < rounds.length && before + rounds[ri].length <= R.done) { before += rounds[ri].length; ri++; }
    R.done = before;   // a resumed race restarts the round it was in
    const play = () => {
      if (ri >= rounds.length) return finish();
      const pool = rounds[ri];
      const tiles = seededShuffle(pool.flatMap((w, n) => [{n, t: w[0], en: true}, {n, t: w[1], en: false}]), seededRng(race.id + ':m' + ri));
      let sel = null, matched = 0;
      $app.innerHTML = `${top()}<div class="count">${ri + 1}/${rounds.length}판</div>
      <div class="match" id="mg" style="--cols:${pool.length > 4 ? 4 : 2}">${tiles.map((x, k) => `<button class="tile${x.en ? ' en' : ''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>`;
      document.getElementById('mg').onclick = e => {
        const b = e.target.closest('.tile'); if (!b || b.classList.contains('gone')) return;
        const x = tiles[+b.dataset.k];
        if (!sel) { sel = b; b.classList.add('sel'); return; }
        if (sel === b) { b.classList.remove('sel'); sel = null; return; }
        const y = tiles[+sel.dataset.k];
        if (x.en === y.en) { sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
        if (x.n === y.n) {
          [sel, b].forEach(t => { t.classList.remove('sel'); t.classList.add('ok'); setTimeout(() => t.classList.add('gone'), 200); });
          sel = null; matched++; R.done++; prog(); send();
          if (matched === pool.length) { ri++; timers.push(setTimeout(play, 350)); }
        } else {
          const a = sel; [a, b].forEach(t => { t.classList.remove('sel'); t.classList.add('no'); setTimeout(() => t.classList.remove('no'), 400); });
          sel = null; miss(pool[(x.en ? x : y).n]); prog();
        }
      };
    };
    play();
  }
}

/* the board: refreshes every 5 seconds, big mode for the classroom screen */

/* ---------- confusing words: missed in a quiz or starred on a card; kept per student, merged with the server's record ---------- */
const wkey = w => (w.pid || (SET && SET.id) || '') + '|' + w[0];
const confKey = () => 'wordroom-confused-' + (AUTH ? AUTH.sid : 'guest');
function confLoad(){ const c = store.get(confKey(), null); return c && c.items ? c : {items: {}, removed: {}}; }
function confSave(c){ store.set(confKey(), c); }
function confAdd(words, star){
  if (!words.length) return;
  const c = confLoad(), now = Date.now();
  words.forEach(w => { const k = wkey(w); c.items[k] = Object.assign(c.items[k] || {added: now}, star ? {star: true} : {}); delete c.removed[k]; });
  confSave(c);
}
function confRemove(w){ const c = confLoad(), k = wkey(w); delete c.items[k]; c.removed[k] = Date.now(); confSave(c); }
const confHas = w => !!confLoad().items[wkey(w)];
/* a star button that puts a word in (or takes it out of) the confusing list; used on every screen but the matching game */
const starBtn = (w, extra) => { const on = confHas(w); return `<button type="button" class="star${extra ? ' ' + extra : ''}${on ? ' on' : ''}" data-star aria-pressed="${on}" aria-label="헷갈리는 단어로 표시">${STAR(on)}</button>`; };
function toggleStar(btn, w){
  const on = !confHas(w);
  if (on) confAdd([w], true); else confRemove(w);
  btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on); btn.innerHTML = STAR(on);
  toast(on ? '헷갈리는 단어에 넣었어요' : '헷갈리는 단어에서 뺐어요');
}
const bindStar = w => { const b = $app.querySelector('.card [data-star]'); if (b) b.onclick = e => { e.stopPropagation(); toggleStar(b, w); }; };
/* a wrong answer goes in at once, so the star lights up and the student can take it back out */
const markStar = w => { confAdd([w]); const b = $app.querySelector('.card [data-star]'); if (b) { b.classList.add('on'); b.setAttribute('aria-pressed', true); b.innerHTML = STAR(true); } };
let RUN_T = 0;   // when the current quiz started: a word taken out during it is not put back at the end
const confIn = words => { const c = confLoad(); return words.filter(w => c.items[wkey(w)]); };
/* pull wrong answers saved on the server so the list follows the student to another device */
async function confSync(){
  if (!ACCOUNTS || !AUTH) return false;
  try {
    const r = await api('me', {token: AUTH.token});
    const c = confLoad(); let added = 0;
    r.wrong.forEach(x => {
      const w = lookupWord(x.en, x.page); if (!w[1]) return;
      const k = wkey(w), t = Date.parse(x.last) || 0;
      if (!c.items[k] && t > (c.removed[k] || 0)) { c.items[k] = {added: t}; added++; }
    });
    confSave(c); return added > 0;
  } catch(e){ onAuthErrorQuiet(e); return false; }
}
function onAuthErrorQuiet(e){ if (e && e.code === 'auth') setAuth(null); }

/* ---------- flashcards: tap to flip, swipe or arrows to move, star to keep ---------- */

const cardOpts = store.get('wordroom-card-opts', {shuffle: false, koFirst: false});

  };

/* ---------- multiple choice (both directions); distractors come from the same set and never share the answer's meaning ---------- */
function viewQuiz(words, mode){
  stopTimers();
  const toKo = mode === 'choice';
  const deck = shuffle(words); let i = 0, right = 0; const wrong = []; RUN_T = Date.now();
  const draw = () => {
    if (i >= deck.length) return viewResult(mode, right, deck.length, wrong);
    const w = deck[i];
    const others = shuffle(SET.w.filter(x => x[1] !== w[1] && x[0] !== w[0]));
    const seen = new Set([toKo ? w[1] : w[0]]), pick = [];
    for (const x of others) { const t = toKo ? x[1] : x[0]; if (!seen.has(t)) { seen.add(t); pick.push(t); } if (pick.length === 3) break; }
    const answer = toKo ? w[1] : w[0], opts = shuffle([answer, ...pick]);
    $app.innerHTML = `${header(back())}${prog(i, deck.length)}
    <div class="card has-star" style="min-height:170px">${starBtn(w)}${toKo ? `<div class="big">${esc(w[0])}</div>${sayBtn(w[0])}` : `<div class="ko big-ko">${esc(w[1])}</div>${w.rel ? `<div class="tag">${esc(w[2])}</div>` : ''}<div class="hint">알맞은 영어 단어를 고르세요</div>`}</div>
    <div class="choices">${opts.map((o, k) => `<button class="choice${toKo ? '' : ' en'}" data-k="${k}">${esc(o)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
    bindBack(); bindStar(w);
    $app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      const ok = opts[+b.dataset.k] === answer;
      $app.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (opts[+c.dataset.k] === answer) c.classList.add('ok'); });
      if (ok) right++; else { b.classList.add('no'); wrong.push(w); markStar(w); }
      if (!toKo) speak(w[0]);
      const fb = document.getElementById('fb'); fb.className = 'feedback ' + (ok ? 'ok' : 'no'); fb.textContent = ok ? '정답!' : '아쉬워요. 초록색이 정답이에요.';
      timers.push(setTimeout(() => { i++; draw(); }, ok ? 700 : 1600));
    });
  };
  draw();
}

/* ---------- spelling: the first letter of every word is shown, since several words can share a meaning ---------- */
function viewSpell(words){
  stopTimers();
  const deck = shuffle(words); let i = 0, right = 0; const wrong = []; RUN_T = Date.now();
  const draw = () => {
    if (i >= deck.length) return viewResult('spell', right, deck.length, wrong);
    const [en, ko] = deck[i], key = plain(en); let extra = 0, done = false;
    const firsts = new Set(); key.replace(/[A-Za-z]+/g, (m, off) => { firsts.add(off); return m; });
    const mask = () => { let seen = 0; return key.split('').map((ch, k) => { if (!/[A-Za-z]/.test(ch)) return ch === ' ' ? ' ' : ch; seen++; return firsts.has(k) || seen <= extra + 1 ? ch : '_'; }).join(' '); };
    $app.innerHTML = `${header(back())}${prog(i, deck.length)}
    <div class="card has-star" style="min-height:160px">${starBtn(deck[i])}<div class="ko big-ko">${esc(ko)}</div>${deck[i].rel ? `<div class="tag">${esc(deck[i][2])}</div>` : ''}<div class="mask" id="hn" aria-label="힌트">${esc(mask())}</div></div>
    <form id="fm" class="row" style="flex-direction:column;align-items:stretch" autocomplete="off">
      <input class="answer" id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 쓰세요" aria-label="영어 답">
      <div class="feedback" id="fb"></div>
      <div class="row"><button type="button" class="btn ghost" id="hint">한 글자 더</button><button type="button" class="btn ghost" id="skip">모르겠어요</button><button type="submit" class="btn mark wide" id="sub">확인</button></div>
    </form>`;
    bindBack(); bindStar(deck[i]);
    const ans = document.getElementById('ans'), fb = document.getElementById('fb'), sub = document.getElementById('sub');
    timers.push(setTimeout(() => ans.focus(), 50));
    const finish = ok => {
      done = true; ans.classList.add(ok ? 'ok' : 'no'); ans.readOnly = true;
      fb.className = 'feedback ' + (ok ? 'ok' : 'no');
      fb.innerHTML = ok ? '정답!' : `정답: <span style="font-family:var(--f-word)">${esc(en)}</span>`;
      if (ok) right++; else { wrong.push(deck[i]); markStar(deck[i]); }
      speak(en); sub.textContent = '다음'; sub.focus();
    };
    document.getElementById('hint').onclick = () => { if (done) return; extra = Math.min(extra + 1, key.replace(/[^A-Za-z]/g, '').length - 1); document.getElementById('hn').textContent = mask(); ans.focus(); };
    document.getElementById('skip').onclick = () => { if (!done) finish(false); };
    document.getElementById('fm').onsubmit = e => {
      e.preventDefault();
      if (done) { i++; return draw(); }
      if (!ans.value.trim()) return;
      finish(norm(ans.value) === norm(en));
    };
  };
  draw();
}

/* ---------- matching game: 8 pairs on a 4x4 board, a wrong pair adds a 1-second penalty ---------- */
function viewMatch(words){
  stopTimers();
  const pool = [], seenEn = new Set(), seenKo = new Set();
  for (const w of shuffle(words)) { if (seenEn.has(w[0]) || seenKo.has(w[1])) continue; seenEn.add(w[0]); seenKo.add(w[1]); pool.push(w); if (pool.length === 8) break; }
  const tiles = shuffle(pool.flatMap((w, n) => [{n, t: w[0], en: true}, {n, t: w[1], en: false}]));
  let sel = null, matched = 0, penalty = 0, misses = 0, start = 0, done = false; const missed = new Set();
  const bestKey = 'wordroom-match-best-' + SET.id + '-' + pool.length;
  $app.innerHTML = `${header(back())}
  <div class="row" style="justify-content:space-between"><div class="count">${esc(SET.t)} · 매칭 게임</div><div class="timer" id="tm">0.0초</div></div>
  <div class="match" id="mg" style="--cols:${pool.length > 4 ? 4 : 2}">
    ${tiles.map((x, k) => `<button class="tile${x.en ? ' en' : ''}" data-k="${k}">${esc(x.t)}</button>`).join('')}
  </div>
  <div class="help" id="mh">단어와 뜻을 차례로 눌러 짝을 맞혀요. 틀리면 1초가 더해져요.</div>`;
  bindBack();
  const tm = document.getElementById('tm');
  const elapsed = () => start ? (performance.now() - start) / 1000 + penalty : 0;
  const tick = setInterval(() => { if (!done) tm.textContent = elapsed().toFixed(1) + '초'; }, 100); timers.push(tick);
  document.getElementById('mg').onclick = e => {
    const b = e.target.closest('.tile'); if (!b || done || b.classList.contains('gone')) return;
    if (!start) start = performance.now();
    const x = tiles[+b.dataset.k];
    if (!sel) { sel = b; b.classList.add('sel'); if (x.en) speak(x.t); return; }
    if (sel === b) { b.classList.remove('sel'); sel = null; return; }
    const y = tiles[+sel.dataset.k];
    if (x.en === y.en) { sel.classList.remove('sel'); sel = b; b.classList.add('sel'); if (x.en) speak(x.t); return; }
    if (x.n === y.n) {
      [sel, b].forEach(t => { t.classList.remove('sel'); t.classList.add('ok'); setTimeout(() => t.classList.add('gone'), 250); });
      sel = null; matched++;
      if (matched === pool.length) finishGame();
    } else {
      penalty += 1; misses++; missed.add((x.en ? x : y).n);
      const a = sel; [a, b].forEach(t => { t.classList.remove('sel'); t.classList.add('no'); setTimeout(() => t.classList.remove('no'), 450); });
      sel = null;
      tm.classList.add('pen'); setTimeout(() => tm.classList.remove('pen'), 450);
    }
  };
  function finishGame(){
    done = true; const t = elapsed(); tm.textContent = t.toFixed(1) + '초';
    const best = store.get(bestKey, null), isBest = best === null || t < best;
    if (isBest) store.set(bestKey, t);
    const miss = [...missed].map(n => pool[n]);
    confAdd(miss);
    if (ACCOUNTS && AUTH) sendLog({page: SET.id, pageTitle: SET.t, mode: '매칭 ' + t.toFixed(1) + '초', score: pool.length - miss.length, total: pool.length, wrong: miss.map(w => w[0])});
    setTimeout(() => {
      $app.innerHTML = `${header(back())}
      <div class="panel" style="padding:24px;display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <div class="count">${esc(SET.t)} · 매칭 게임 · ${pool.length}쌍</div>
        <div class="score">${t.toFixed(1)}<small>초</small></div>
        <div class="help">${misses ? `틀린 짝 ${misses}번 (+${misses}초)` : '한 번도 안 틀렸어요!'} · ${isBest ? '최고 기록이에요' : `최고 기록 ${best.toFixed(1)}초`}</div>
      </div>
      ${miss.length ? `<div class="section-label">헷갈린 단어 ${miss.length}개</div><div class="panel"><ul class="wl">${miss.map(wordRow).join('')}</ul></div>` : ''}
      <div class="row"><button class="btn mark wide" id="again">${words.length > 8 ? '새 단어로 한 판 더' : '한 판 더'}</button></div>`;
      bindBack();
      document.getElementById('again').onclick = () => viewMatch(words);
      scrollTo(0, 0);
    }, 450);
  }
  scrollTo(0, 0);
}

/* ---------- QR helpers ---------- */
function makeQR(url){ try { const q = qrcode(0, 'L'); q.addData(url); q.make(); return q; } catch(e){ return null; } }
function qrCard(title, url, q, id){
  return `<div class="qrcard"><div class="qt">${esc(title)}</div><div class="qi">${q ? q.createSvgTag({cellSize: 4, margin: 0, scalable: true}) : '<p class="help" style="color:#333">QR로 만들기엔 내용이 너무 길어요</p>'}</div></div>
