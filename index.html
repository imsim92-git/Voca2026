/* ---------- my study data: confusing words (missed in a quiz or starred), last score per page, best matching time.
   Kept on the server in the student's row so every browser shows the same; this browser keeps a copy and
   sends its changes a moment later. Both sides merge by time: the later of "put in" and "taken out" wins. ---------- */
const wkey = w => (w.pid || (SET && SET.id) || '') + '|' + w[0];
const confKey = () => 'wordroom-confused-' + (AUTH ? AUTH.sid : 'guest');   // older versions kept the list here
const myKey = () => 'wordroom-my-' + (AUTH ? AUTH.sid : 'guest');
let MY = null, MY_SID = null, myDirty = false, mySyncT = null, mySyncing = null;
function myLoad(){
  const sid = AUTH ? AUTH.sid : 'guest';
  if (MY && MY_SID === sid) return MY;
  MY_SID = sid; MY = store.get(myKey(), null);
  if (!MY) {   // first time with this version: bring along what this browser already had
    MY = {items: {}, removed: {}, last: {}, best: {}};
    const old = store.get(confKey(), null);
    if (old && old.items) { MY.items = old.items; MY.removed = old.removed || {}; }
    try {
      const pre = 'wordroom-last-' + (AUTH ? AUTH.sid + '-' : '');
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pre)) { const v = store.get(k, null); if (v && v.m) MY.last[k.slice(pre.length)] = Object.assign({at: 0}, v); } }
    } catch(e){}
    myDirty = !!(Object.keys(MY.items).length || Object.keys(MY.last).length);
    store.set(myKey(), MY);
  }
  ['items', 'removed', 'last', 'best'].forEach(k => { MY[k] = MY[k] || {}; });
  return MY;
}
function mySave(){ store.set(myKey(), MY); }
/* every change (a miss, a star, "외웠어요") is sent right away. If one is already on its way, the next
   goes the moment it comes back, with everything that changed meanwhile, so requests never pile up */
const syncIfDirty = () => { if (myDirty) syncMy(); };
/* closing the tab or switching apps: send anything not yet sent */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') syncIfDirty(); });
function myChanged(){ mySave(); myDirty = true; clearTimeout(mySyncT); if (mySyncing) mySyncing.again = true; else mySyncT = setTimeout(syncIfDirty, 0); }
const confLoad = () => myLoad();
function confSave(){ myChanged(); }
/* same merge as the server's: the later of added/removed wins, the later score, the shorter time */
function mergeMy(a, b){
  const out = {items: {}, removed: {}, last: {}, best: {}}, keys = new Set();
  [a.items, b.items, a.removed, b.removed].forEach(o => Object.keys(o || {}).forEach(k => keys.add(k)));
  keys.forEach(k => {
    const ia = (a.items || {})[k], ib = (b.items || {})[k];
    const add = Math.max(ia ? ia.added : -1, ib ? ib.added : -1), rem = Math.max((a.removed || {})[k] || 0, (b.removed || {})[k] || 0);
    if ((ia || ib) && add > rem) { out.items[k] = {added: add}; if ((ia && ia.star) || (ib && ib.star)) out.items[k].star = true; }
    else if (rem) out.removed[k] = rem;
  });
  [a.last, b.last].forEach(o => Object.keys(o || {}).forEach(k => { if (!out.last[k] || o[k].at > out.last[k].at) out.last[k] = o[k]; }));
  [a.best, b.best].forEach(o => Object.keys(o || {}).forEach(k => { if (!out.best[k] || o[k] < out.best[k]) out.best[k] = o[k]; }));
  return out;
}
const myCount = m => Object.keys(m.items).length + ':' + Object.keys(m.removed).length + ':' + JSON.stringify(m.last) + JSON.stringify(m.best);
/* the changes waiting to be sent, taken once so they ride along with whichever request goes first */
function takeMyForSend(){

}
function myLater(){ myDirty = true; clearTimeout(mySyncT); mySyncT = setTimeout(syncIfDirty, 5000); }   // after a failed send: try again a little later
/* take in what the server sent back (from a sync or from a saved practice result) */
function applyMy(pack, sid){
  if (!pack || !pack.my || !AUTH || AUTH.sid !== sid) return false;
  const cur = myLoad(), before = myCount(cur);
  let next;
  if (cur.epoch && cur.epoch !== (pack.my.epoch || '')) { next = pack.my; myDirty = false; }   // the teacher cleared it: this browser's old copy goes
  else next = mergeMy(pack.my, cur);   // keeps any change made while this was on its way (that change is already marked to be sent)

}
function syncMy(){
  if (!ACCOUNTS || !AUTH || !API) return Promise.resolve(false);

  const sid = AUTH.sid, my = takeMyForSend();
  const run = (async () => {
    try {

}

/* ---------- multiple choice (both directions); distractors come from the same set and never share the answer's meaning ---------- */
function viewQuiz(words, mode){
  stopTimers();
  const toKo = mode === 'choice';
  const deck = shuffle(words); let i = 0, right = 0; const wrong = []; RUN_T = Date.now();

    const w = deck[i];
    // wrong choices come from every word when practising the combined confusing list, which can be short
    const pool = SET.id === 'allconf' ? [...PAGES.flatMap(p => p.w), ...SETS.flatMap(s => s.w)] : SET.w;
    const others = shuffle(pool.filter(x => x[1] && x[1] !== w[1] && x[0] !== w[0]));
    const seen = new Set([toKo ? w[1] : w[0]]), pick = [];
    for (const x of others) { const t = toKo ? x[1] : x[0]; if (!seen.has(t)) { seen.add(t); pick.push(t); } if (pick.length === 3) break; }
    const answer = toKo ? w[1] : w[0], opts = shuffle([answer, ...pick]);
    $app.innerHTML = `${header(back())}${prog(i, deck.length)}

    <div class="choices">${opts.map((o, k) => `<button class="choice${toKo ? '' : ' en'}" data-k="${k}">${esc(o)}</button>`).join('')}</div>

}

/* ---------- spelling: the first letter of every word is shown, since several words can share a meaning ---------- */
function viewSpell(words){
  stopTimers();
  const deck = shuffle(words); let i = 0, right = 0; const wrong = []; RUN_T = Date.now();
  const draw = () => {
    if (i >= deck.length) return viewResult('spell', right, deck.length, wrong);
    const [en, ko] = deck[i], key = plain(en); let extra = 0, done = false;
    const firsts = new Set(); key.replace(/[A-Za-z]+/g, (m, off) => { firsts.add(off); return m; });
    const mask = () => { let seen = 0; return key.split('').map((ch, k) => { if (!/[A-Za-z]/.test(ch)) return ch === ' ' ? ' ' : ch; seen++; return firsts.has(k) || seen <= extra + 1 ? ch : '_'; }).join(' '); };
    $app.innerHTML = `${header(back())}${prog(i, deck.length)}
    <div class="card has-star" style="min-height:160px">${starBtn(deck[i])}<div class="ko big-ko">${esc(ko)}</div>${deck[i].rel ? `<div class="tag">${esc(deck[i][2])}</div>` : ''}<div class="mask" id="hn" aria-label="힌트">${esc(mask())}</div></div>
    <form id="fm" class="row" style="flex-direction:column;align-items:stretch" autocomplete="off">
      <input class="answer" id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 쓰세요" aria-label="영어 답">
      <div class="feedback" id="fb"></div>
      <div class="row"><button type="button" class="btn ghost" id="hint">한 글자 더</button><button type="button" class="btn ghost" id="skip">모르겠어요</button><button type="submit" class="btn mark wide" id="sub">확인</button></div>
    </form>`;
    bindBack(); bindStar(deck[i]);
    const ans = document.getElementById('ans'), fb = document.getElementById('fb'), sub = document.getElementById('sub');
    timers.push(setTimeout(() => ans.focus(), 50));
    const finish = ok => {
      done = true; ans.classList.add(ok ? 'ok' : 'no'); ans.readOnly = true;
      fb.className = 'feedback ' + (ok ? 'ok' : 'no');
      fb.innerHTML = ok ? '정답!' : `정답: <span style="font-family:var(--f-word)">${esc(en)}</span>`;
      if (ok) right++; else { wrong.push(deck[i]); markStar(deck[i]); }
      speak(en); sub.textContent = '다음'; sub.focus();
    };
    document.getElementById('hint').onclick = () => { if (done) return; extra = Math.min(extra + 1, key.replace(/[^A-Za-z]/g, '').length - 1); document.getElementById('hn').textContent = mask(); ans.focus(); };
    document.getElementById('skip').onclick = () => { if (!done) finish(false); };
    document.getElementById('fm').onsubmit = e => {
      e.preventDefault();
      if (done) { i++; return draw(); }
      if (!ans.value.trim()) return;
      finish(norm(ans.value) === norm(en));
    };
  };
  draw();
}

/* ---------- matching game: 8 pairs on a 4x4 board, a wrong pair adds a 1-second penalty ---------- */
function viewMatch(words){
  stopTimers();
  const pool = [], seenEn = new Set(), seenKo = new Set();
  for (const w of shuffle(words)) { if (seenEn.has(w[0]) || seenKo.has(w[1])) continue; seenEn.add(w[0]); seenKo.add(w[1]); pool.push(w); if (pool.length === 8) break; }
  const tiles = shuffle(pool.flatMap((w, n) => [{n, t: w[0], en: true}, {n, t: w[1], en: false}]));
  let sel = null, matched = 0, penalty = 0, misses = 0, start = 0, done = false; const missed = new Set();
  const bestKey = SET.id + '-' + pool.length;
  $app.innerHTML = `${header(back())}
  <div class="row" style="justify-content:space-between"><div class="count">${esc(SET.t)} · 매칭 게임</div><div class="timer" id="tm">0.0초</div></div>
  <div class="match" id="mg" style="--cols:${pool.length > 4 ? 4 : 2}">
    ${tiles.map((x, k) => `<button class="tile${x.en ? ' en' : ''}" data-k="${k}">${esc(x.t)}</button>`).join('')}
  </div>
  <div class="help" id="mh">단어와 뜻을 차례로 눌러 짝을 맞혀요. 틀리면 1초가 더해져요.</div>`;
  bindBack();
  const tm = document.getElementById('tm');
  const elapsed = () => start ? (performance.now() - start) / 1000 + penalty : 0;
  const tick = setInterval(() => { if (!done) tm.textContent = elapsed().toFixed(1) + '초'; }, 100); timers.push(tick);
  document.getElementById('mg').onclick = e => {
    const b = e.target.closest('.tile'); if (!b || done || b.classList.contains('gone')) return;
    if (!start) start = performance.now();
    const x = tiles[+b.dataset.k];
    if (!sel) { sel = b; b.classList.add('sel'); if (x.en) speak(x.t); return; }
    if (sel === b) { b.classList.remove('sel'); sel = null; return; }
    const y = tiles[+sel.dataset.k];
    if (x.en === y.en) { sel.classList.remove('sel'); sel = b; b.classList.add('sel'); if (x.en) speak(x.t); return; }
    if (x.n === y.n) {
      [sel, b].forEach(t => { t.classList.remove('sel'); t.classList.add('ok'); setTimeout(() => t.classList.add('gone'), 250); });
      sel = null; matched++;
      if (matched === pool.length) finishGame();
    } else {
      penalty += 1; misses++; missed.add((x.en ? x : y).n);
      const a = sel; [a, b].forEach(t => { t.classList.remove('sel'); t.classList.add('no'); setTimeout(() => t.classList.remove('no'), 450); });
      sel = null;
      tm.classList.add('pen'); setTimeout(() => tm.classList.remove('pen'), 450);
    }
  };
  function finishGame(){
    done = true; const t = elapsed(); tm.textContent = t.toFixed(1) + '초';
    const bestT = myLoad().best[bestKey], best = bestT === undefined ? null : bestT, isBest = best === null || t < best;
    if (isBest) { myLoad().best[bestKey] = Math.round(t * 10) / 10; myChanged(); }
    const miss = [...missed].map(n => pool[n]);
    confAdd(miss);
    const ranked = rankable();
    if (canLog()) sendLog(Object.assign({page: SET.id, pageTitle: SET.t, mode: '매칭 ' + t.toFixed(1) + '초', score: pool.length - miss.length, total: pool.length, wrong: miss.map(w => w[0])}, ranked ? {rank: 'match', secs: Math.round(t * 10) / 10} : {}));
    setTimeout(() => {
      $app.innerHTML = `${header(back())}
      <div class="panel" style="padding:24px;display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <div class="count">${esc(SET.t)} · 매칭 게임 · ${pool.length}쌍</div>
        <div class="score">${t.toFixed(1)}<small>초</small></div>
        <div class="help">${misses ? `틀린 짝 ${misses}번 (+${misses}초)` : '한 번도 안 틀렸어요!'} · ${isBest ? '최고 기록이에요' : `최고 기록 ${best.toFixed(1)}초`}</div>
      </div>
      ${miss.length ? `<div class="section-label">헷갈린 단어 ${miss.length}개</div><div class="panel"><ul class="wl">${miss.map(wordRow).join('')}</ul></div>` : ''}
      <div class="row"><button class="btn mark wide" id="again">${words.length > 8 ? '새 단어로 한 판 더' : '한 판 더'}</button></div>
      ${ranked && AUTH ? '<div class="foot"><button class="link" id="toRanks">순위 보기</button></div>' : ''}`;
      bindBack(); bindToRanks('match');
      document.getElementById('again').onclick = () => viewMatch(words);
      scrollTo(0, 0);
    }, 450);
  }
  scrollTo(0, 0);
}

/* ---------- QR helpers ---------- */
function makeQR(url){ try { const q = qrcode(0, 'L'); q.addData(url); q.make(); return q; } catch(e){ return null; } }
function qrCard(title, url, q, id){
  return `<div class="qrcard"><div class="qt">${esc(title)}</div><div class="qi">${q ? q.createSvgTag({cellSize: 4, margin: 0, scalable: true}) : '<p class="help" style="color:#333">QR로 만들기엔 내용이 너무 길어요</p>'}</div></div>
  <div class="urlbox" id="url-${id}">${esc(url)}</div>
  <div class="row" style="width:100%"><button class="btn wide" data-copy="${id}">링크 복사</button><button class="btn ghost wide" data-png="${id}" hidden>QR 이미지 저장</button></div>`;
}
async function copyText(id){
  const el = document.getElementById('url-' + id);
  try { await navigator.clipboard.writeText(el.textContent); toast('링크를 복사했어요'); }
  catch(e){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('링크가 선택됐어요. 복사해 주세요'); }
}
async function getDownloads(){ return {save: async ({filename, data}) => { const u = URL.createObjectURL(data); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }}; }
function qrPng(q, title){
  const n = q.getModuleCount(), cell = Math.max(6, Math.floor(600 / n)), sz = n * cell, pad = 36, head = 96;
  const c = document.createElement('canvas'); c.width = sz + pad * 2 + 40; c.height = sz + pad * 2 + head + 40;
  const g = c.getContext('2d');
  g.fillStyle = '#1b2550'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#f3f4f8'; g.font = 'bold 40px "IBM Plex Sans KR", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(title, c.width / 2, 20 + head / 2);
  const x0 = 20, y0 = head + 20;
  g.fillStyle = '#ffffff'; g.beginPath(); if (g.roundRect) g.roundRect(x0, y0, sz + pad * 2, sz + pad * 2, 24); else g.rect(x0, y0, sz + pad * 2, sz + pad * 2); g.fill();
  g.fillStyle = '#000000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect(x0 + pad + k * cell, y0 + pad + r * cell, cell, cell);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
function wireQR(root, items){
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy));
  getDownloads().then(dl => {
    if (!dl) return;
    root.querySelectorAll('[data-png]').forEach(b => {
      const it = items[b.dataset.png]; if (!it.q) return;
      b.hidden = false;
      b.onclick = async () => { try { await dl.save({filename: (it.title.replace(/[\\/:*?"<>|]/g, '') || 'words') + ' QR.png', data: await qrPng(it.q, it.title)}); } catch(e){ if (e && e.code !== 'declined') toast('이미지를 저장하지 못했어요'); } };
    });
  });
}

/* ---------- teacher ---------- */
function parseLines(text){
  const out = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim().replace(/^\d+[.)]\s*/, '').replace(/^[-•·]\s*/, ''); if (!line) continue;
    let m = line.split('\t');
    if (m.length < 2) { const k = line.search(/\s[-–—:=|]\s|[:=|]\s|\|/); if (k > 0) { const sep = line.slice(k).match(/^\s*[-–—:=|]\s*/)[0]; m = [line.slice(0, k), line.slice(k + sep.length)]; } }
    if (m.length < 2) { const k = line.search(/[가-힣(~]/); if (k > 0) m = [line.slice(0, k).replace(/[,\s]+$/, ''), line.slice(k)]; }
    if (m.length < 2) { const k = line.indexOf(','); if (k > 0) m = [line.slice(0, k), line.slice(k + 1)]; }
    if (m.length >= 2 && m[0].trim()) out.push([m[0].trim(), m[1].trim(), m.slice(2).join(' ').trim()]);
  }
  return out;
}

  document.getElementById('toPages').onclick = () => route();
  bindAdminNav();
  const sel = document.getElementById('qrsel'), qrout = document.getElementById('qrout');
  const showSel = () => { const it = items[sel.value]; qrout.innerHTML = qrCard(it.title, it.url, it.q, it.id); wireQR(qrout, items); };
  sel.onchange = showSel; showSel();

  scrollTo(0, 0);
}

/* ---------- boot: #p1, #p3-4 … opens a page, #all the whole book, #w… a teacher-made set ---------- */
let setsPromise = null;
function boot(){
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (API && !setsPromise) setsPromise = loadSets().then(changed => { if ($app.querySelector('[data-root]') || ($app.querySelector('.pages [data-id]') && hasRoot() && origin === 'root')) viewRoot(); return changed; });
  if (h === 'admin') return isTeacher() ? leaveTeacher() : viewAdmin();
  if (tvGet() && !isTeacher()) { if (adminValid()) return enterTeacher(tvClass()); tvSet(null); }
  if (h === 'team' && !TEAM) return viewLogin(route, 'team');
  if (TEAM) return viewTeamHome();
  if (LOGIN && !AUTH) return viewLogin(route);
  flushQueue(); if (AUTH && !boot.synced) { boot.synced = true; syncMy(); }
  route();
}
function route(){
  if (location.hash === '#admin') setHash('');   // leaving the teacher screens
  if (TEAM) return viewTeamHome();
  if (LOGIN && !AUTH) return viewLogin(route);
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (h === 'all') { SET = ALL; origin = 'pages'; return viewHome(); }
  const p = PAGES.find(p => p.id === h);
  if (p) { SET = p; origin = 'pages'; return viewHome(); }
  const s = h[0] === 'w' ? decodeToken(h) : null;
  if (s) { SET = s; origin = 'link'; return viewHome(); }
  const ps = SETS.find(x => x.id === h);
  if (ps) { SET = ps; origin = 'root'; return viewHome(); }
  if (/^s[0-9a-f]{7}$/.test(h) && !setsLoaded && setsPromise) { $app.innerHTML = `${header()}<div class="panel empty">지문을 불러오는 중…</div>`; return setsPromise.then(route); }
  if (hasRoot()) return viewRoot();
  viewPages();
}
/* the phone's or browser's back button moves up one menu inside the site instead of leaving it.
   The site keeps a few of its own history entries on top of the page and each back press uses one up,
   opening the menu above (the same as the "←" button on screen). Chrome ignores history entries a page adds
   on its own, so they are added only when the student taps something, and refilled on every tap.
   On the first screen, back leaves the site as usual. Screens with no way back (a race in progress) stay put. */
let lastHref = location.href;
const GUARDS = 12;
const UP_BUTTONS = ['#back', '#up', '#toRoot', '#toPages', '#tologin', '#home'];
function upButton(){ for (const sel of UP_BUTTONS) { const b = $app.querySelector(sel); if (b && b.getClientRects().length) return b; } return null; }
const isFirstScreen = () => !isTeacher() && !!($app.querySelector('[data-root]') || $app.querySelector('#af') || $app.querySelector('#tf') || $app.querySelector('#trefresh')
  || ($app.querySelector('.pages button.page[data-id]') && !$app.querySelector('#toRoot')));
const ours = st => st && (st.wr === 'base' || st.wr === 'g');
let curI = ours(history.state) ? history.state.i || 0 : 0;
function topUp(){
  if (!ours(history.state)) { history.replaceState({wr: 'base', i: 0}, '', location.href); curI = 0; }
  while (curI < GUARDS) { curI++; history.pushState({wr: 'g', i: curI}, '', location.href); }
}
document.addEventListener('click', e => { if (e.isTrusted) topUp(); }, true);     // real taps only, not the site's own clicks
document.addEventListener('keydown', e => { if (e.isTrusted) topUp(); }, true);
window.addEventListener('popstate', () => {
  const st = history.state;
  if (!ours(st)) return;                          // a typed #address: ordinary navigation
  const i = st.i || 0;
  history.replaceState(st, '', lastHref);         // keep the address of the screen being shown
  if (i >= curI) { curI = i; return; }            // forward: nothing to do
  let steps = curI - i; curI = i;
  while (steps-- > 0) {
    const up = upButton();
    if (up) { up.click(); continue; }
    if (isTeacher()) { leaveTeacher(); continue; }
    if (isFirstScreen()) { history.go(-(i + 1)); return; }   // the first screen: leave the site
    break;                                         // no way back from here: stay
  }
});
boot();
if (!ours(history.state)) history.replaceState({wr: 'base', i: 0}, '', location.href);
window.addEventListener('hashchange', () => { if (location.href === lastHref) return; lastHref = location.href; boot(); });
</script>
