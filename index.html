<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 학습 사이트</title>
<meta name="description" content="영어 학습지 단어를 페이지별로 연습하는 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Young+Serif&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow study column (max 560px) — a navy title card on top, white choice tiles, then one exercise at a time. */
:root{
  --paper:#f3f4f8; --surface:#ffffff; --ink:#151a33; --muted:#5d6380; --line:#dcdfea;
  --navy:#1b2550; --navy-fg:#f3f4f8; --mark:#ffd84a; --mark-ink:#2a2200;
  --good:#1f8a5b; --good-bg:#e3f4ec; --bad:#c2413a; --bad-bg:#fbe7e5;
  --c1-bg:#2b54d6; --c1-fg:#ffffff; --c1-line:#2b54d6;
  --c2-bg:#0f7f5a; --c2-fg:#ffffff; --c2-line:#0f7f5a;
  --c3-bg:#b85400; --c3-fg:#ffffff; --c3-line:#b85400;
  --c4-bg:#c2255c; --c4-fg:#ffffff; --c4-line:#c2255c;
  --c5-bg:#6a3fd1; --c5-fg:#ffffff; --c5-line:#6a3fd1;
  --c6-bg:#0b7480; --c6-fg:#ffffff; --c6-line:#0b7480;
  --f-word:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1222; --surface:#181c33; --ink:#eceef7; --muted:#9aa0bd; --line:#2b3150;
  --navy:#232e66; --navy-fg:#f3f4f8; --mark:#f5cf3d; --mark-ink:#241d00;
  --good:#5fd19c; --good-bg:#16332a; --bad:#ff8a80; --bad-bg:#3a1d1f;
  --c1-bg:#2b54d6; --c1-fg:#ffffff; --c1-line:#2b54d6;
  --c2-bg:#0f7f5a; --c2-fg:#ffffff; --c2-line:#0f7f5a;
  --c3-bg:#b85400; --c3-fg:#ffffff; --c3-line:#b85400;
  --c4-bg:#c2255c; --c4-fg:#ffffff; --c4-line:#c2255c;
  --c5-bg:#6a3fd1; --c5-fg:#ffffff; --c5-line:#6a3fd1;
  --c6-bg:#0b7480; --c6-fg:#ffffff; --c6-line:#0b7480;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1222; --surface:#181c33; --ink:#eceef7; --muted:#9aa0bd; --line:#2b3150;
  --navy:#232e66; --navy-fg:#f3f4f8; --mark:#f5cf3d; --mark-ink:#241d00;
  --good:#5fd19c; --good-bg:#16332a; --bad:#ff8a80; --bad-bg:#3a1d1f;
  --c1-bg:#2b54d6; --c1-fg:#ffffff; --c1-line:#2b54d6;
  --c2-bg:#0f7f5a; --c2-fg:#ffffff; --c2-line:#0f7f5a;
  --c3-bg:#b85400; --c3-fg:#ffffff; --c3-line:#b85400;
  --c4-bg:#c2255c; --c4-fg:#ffffff; --c4-line:#c2255c;
  --c5-bg:#6a3fd1; --c5-fg:#ffffff; --c5-line:#6a3fd1;
  --c6-bg:#0b7480; --c6-fg:#ffffff; --c6-line:#0b7480;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* set card */
.setcard{background:var(--navy);color:var(--navy-fg);border-radius:18px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px}
.setcard .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.setcard h1{font-size:28px;font-weight:700}
.setcard .meta{font-size:14px;opacity:.8}
/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--ink);transform:translateY(-1px)}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
/* list */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.wl li:first-child{border-top:0}
.wl .en{font-family:var(--f-word);font-size:18px;min-width:0;overflow-wrap:anywhere}
.wl .ko{grid-column:1;color:var(--muted);font-size:14px;min-width:0}
.wl.hideko .ko{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.wl.hideko li.peek .ko{color:var(--muted);background:none}
.wl .say{grid-row:1/3;grid-column:2}
.say{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}
.say svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.mark{background:var(--mark);color:var(--mark-ink)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45;cursor:default}
/* exercise */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark);transition:width .25s}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:240px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%}
.card .big{font-family:var(--f-word);font-size:clamp(28px,8vw,40px);line-height:1.2;overflow-wrap:anywhere}
.card .ko{font-size:20px;font-weight:500}
.card .hint{font-size:13px;color:var(--muted)}
button.card{cursor:pointer}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:15px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.ok{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.choice.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.answer{width:100%;font:inherit;font-family:var(--f-word);font-size:22px;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.answer.ok{border-color:var(--good)} .answer.no{border-color:var(--bad)}
.feedback{min-height:22px;font-weight:700;text-align:center}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
/* result */
.score{font-family:var(--f-word);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
/* maker */
label{font-weight:700;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:260px;resize:vertical;font-size:14px;line-height:1.6}
.help{font-size:13px;color:var(--muted);margin:0}
.parsed{font-size:13px;color:var(--muted)}
.parsed b{color:var(--ink)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}
.qrcard{background:var(--navy);border-radius:16px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.qrcard .qt{color:var(--navy-fg);font-weight:700;font-size:18px}
.qrcard .qi{background:#fff;border-radius:10px;padding:10px;line-height:0;max-width:100%}
.qrcard .qi svg{width:240px;height:240px;max-width:100%}
.urlbox{width:100%;font-size:12px;color:var(--muted);word-break:break-all;max-height:64px;overflow:auto;background:var(--paper);border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.sample{font-size:12px;font-weight:700;background:var(--mark);color:var(--mark-ink);border-radius:6px;padding:2px 8px;align-self:flex-start}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .12s;min-width:0}
.page:hover{border-color:var(--ink);transform:translateY(-1px)}
.page .pn{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.page b{font-size:22px;font-variant-numeric:tabular-nums}
.page .pc{font-size:13px;color:var(--muted)}
.page .best{font-size:12px;color:var(--good);font-weight:700}
.note{font-size:13px;color:var(--muted)}
.wl .note{grid-column:1}
.wl.hideko .note{visibility:hidden}
.wl.hideko li.peek .note{visibility:visible}
.card .note{font-size:14px}
.section-label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.foot{display:flex;justify-content:center;padding-top:8px}
/* accounts & records */
.muted{color:var(--muted);font-weight:400}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.userbar .link{padding:2px 0}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.form{padding:18px;display:flex;flex-direction:column;gap:14px}
input[type=password]{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
#flt{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.empty{padding:18px;color:var(--muted);font-size:14px}
.wl .cnt{grid-row:1;grid-column:2;font-size:13px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:2px 8px;justify-self:end}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.log li:first-child{border-top:0}
.log li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.log li b{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:700;background:var(--paper)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.en{font-family:var(--f-word)}
tbody tr[data-sid]{cursor:pointer}
tbody tr[data-sid]:hover,tbody tr[data-sid]:focus-visible{background:var(--paper)}
tr.event td{color:var(--muted)}
.chip{font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:5px;padding:1px 6px}
.savestate{font-size:13px;font-weight:700;color:var(--muted)}
.savestate.ok{color:var(--good)}
.btn.danger{background:var(--bad);color:#fff}
.detail{padding:18px;display:flex;flex-direction:column;gap:12px}
.detail .wl li,.detail .log li{padding-inline:0}
.reset{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){.stat b{font-size:20px}.log li{grid-template-columns:1fr auto}.log li span:first-child{grid-column:1/-1}}

/* practice modes v2 */
.tab .tc{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .tc{color:var(--ink)}
.mode:disabled{opacity:.45;cursor:default;transform:none}
.mode:disabled:hover{border-color:var(--line)}
.modes .mode:nth-child(n){min-width:0}
.center{justify-content:center}
.row.small{gap:8px}
.toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flip{position:relative;perspective:1200px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none}
.flip:focus-visible .face{outline:3px solid var(--mark);outline-offset:2px}
.flip-in{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.flip-in.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px 34px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.face.back .note{color:var(--navy-fg);opacity:.75}
.face .no{position:absolute;top:14px;left:18px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.face.back .no{color:var(--navy-fg);opacity:.7}
.face .hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted)}
.face .big{font-family:var(--f-word);font-size:clamp(34px,10vw,64px);line-height:1.15;overflow-wrap:anywhere}
.face .big-ko{font-size:clamp(24px,7vw,42px)!important}
/* cards on a classroom TV or projector: bigger still, so students can read and copy them from their seats */
@media (min-width:1000px){.wrap.cardwide{max-width:1100px}.cardwide .flip-in{min-height:440px}.cardwide .face .big{font-size:clamp(72px,6.5vw,104px)}.cardwide .face .big-ko{font-size:clamp(44px,4vw,64px)!important}.cardwide .face .rels{font-size:28px;gap:8px}.cardwide .face .rels .rel b{font-size:20px;padding:2px 8px}.cardwide .face .rel-en{font-size:30px}.cardwide .face .note{font-size:26px}}
@media (min-width:700px){.face .rel-en{font-size:20px}.flip-in{min-height:340px}.face .big{font-size:clamp(56px,7vw,80px)}.face .big-ko{font-size:clamp(36px,4.6vw,52px)!important}.face .rels{font-size:18px}.face .note{font-size:20px}}
.big-ko{font-size:clamp(20px,6vw,26px)!important;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.star{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center;z-index:2;border-radius:50%}
.star svg{width:24px;height:24px}
.star.on{color:#e0a800}
.flip-in.on ~ .star{color:var(--navy-fg)}
.flip-in.on ~ .star.on{color:var(--mark)}
.choice.en{font-family:var(--f-word);font-size:18px}
.mask{font-family:var(--f-word);font-size:22px;letter-spacing:.06em;color:var(--muted);overflow-wrap:anywhere}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;transition:color .2s}
.timer.pen{color:var(--bad)}
.match{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px}
.tile{min-height:84px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 6px;font-size:14px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;word-break:keep-all;transition:transform .12s,background .15s,opacity .25s;min-width:0}
.tile.en{font-family:var(--f-word);font-weight:400;font-size:15px}
.tile.sel{border-color:var(--ink);background:var(--mark);color:var(--mark-ink);transform:scale(1.03)}
.tile.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.tile.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.tile.gone{opacity:0;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.done{font-size:13px;grid-column:2;grid-row:2/4;align-self:center}
@media (max-width:380px){.tile{font-size:13px;min-height:76px}.tile.en{font-size:14px}}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}.tile.no{animation:none}}

/* related words */
.wl .rels{grid-column:1;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-width:0}
.rel b{font-size:11px;font-weight:700;color:var(--ink);background:var(--line);border-radius:5px;padding:1px 6px;margin-right:4px}
.rel-en{font-family:var(--f-word);color:var(--ink);font-size:14px}
.wl.hideko .rels{visibility:hidden}
.wl.hideko li.peek .rels{visibility:visible}
.face .rels{display:flex;flex-direction:column;gap:4px;font-size:13px;opacity:.85;align-items:center}
.face.back .rel b{background:rgb(255 255 255 / .16);color:var(--navy-fg)}
.face.back .rel-en{color:var(--navy-fg)}
.tag{font-size:12px;font-weight:700;color:var(--muted);background:var(--line);border-radius:6px;padding:2px 8px}
.face.back .tag{background:rgb(255 255 255 / .16);color:var(--navy-fg)}

/* speech availability */
.speechbar{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--bad-bg);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink)}
.speechbar .muted{font-size:13px}
.btn.small{padding:8px 14px;font-size:13px;text-decoration:none}
.say.off{opacity:.4}

/* passages */
.setlist{list-style:none;margin:0;padding:0}
.setlist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.setlist li:first-child{border-top:0}
.sl-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.small{font-size:12px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.iconbtn:disabled{opacity:.35}
.upload{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--surface);font-weight:400}
.upload:hover{border-color:var(--ink)}
.upload input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload{position:relative}
.upload:focus-within{outline:3px solid var(--mark);outline-offset:2px}
.up-icon{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center;flex:none}
.up-icon svg{width:22px;height:22px}
.badlines{background:var(--bad-bg);border-radius:10px;padding:10px 14px;font-size:13px}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="lib/lz-string.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="config.js"></script>
<script src="words.js"></script>
<script>
const BASE_URL = "";  // 비워 두면 지금 접속한 주소를 그대로 씁니다
const BOOK = window.WORD_BOOK || "교과서";            // name of the built-in list (words.js) on the first screen
const SITE_NAME = window.WORD_SITE || "영어 학습 사이트";  // the name at the top of every screen
const PAGES = window.WORD_PAGES || [];
/* each page keeps its head words (shown in the word list) and practises them together with their
   related words (synonyms, antonyms, derived forms from the 4th column of words.js) */
function relWord(h, r, pid){
  const w = [r[1], r[0] === '유의어' ? h[1] : (r[2] || ''), `${r[0]} · ${h[0]}`];
  w.pid = pid; w.rel = r[0]; w.head = h; return w;
}
PAGES.forEach(p => {
  p.heads = p.w;
  p.heads.forEach(w => { w.pid = p.id; });
  p.w = p.heads.flatMap(h => [h, ...(Array.isArray(h[3]) ? h[3] : []).map(r => relWord(h, r, p.id)).filter(w => w[1])]);
});
const ALL = {id: 'all', t: '전체 페이지', heads: PAGES.flatMap(p => p.heads), w: PAGES.flatMap(p => p.w)};
const countLine = set => set.heads && set.w.length > set.heads.length ? `단어 ${set.heads.length}개 · 관련어 ${set.w.length - set.heads.length}개` : `${set.w.length}개 단어`;

const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }
let VIEWSEQ = 0;   // lets a slow answer know whether its screen is still showing
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* answer key: drop symbols and structure markers that are not typed ("~", "…", "+ 결과", "+O+O.C.") */
const plain = en => en.replace(/\+.*$/, '').replace(/[~…()]/g, ' ').replace(/[가-힣]/g, '').replace(/\s+/g, ' ').trim();
const norm = s => plain(s).toLowerCase().replace(/[’`]/g, "'").replace(/\s*-\s*/g, '-');
const spoken = en => plain(en).replace(/\bto-v\b/g, 'to do').replace(/\bA\b/g, 'A');

/* ---------- link encoding for teacher-made sets (#w…) ---------- */
function b64url(u8){ let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function valid(j){ return j && Array.isArray(j.w) && j.w.length ? {id: 'custom', t: String(j.t || '단어장'), w: j.w.filter(p => Array.isArray(p) && p[0]).map(p => [String(p[0]).trim(), String(p[1] || '').trim(), String(p[2] || '').trim()])} : null; }
function encodeSet(set){ return 'w' + b64url(LZString.compressToUint8Array(JSON.stringify({t: set.t, w: set.w.map(p => p[2] ? p : [p[0], p[1]])}))); }
function decodeToken(tok){ try { return valid(JSON.parse(LZString.decompressFromUint8Array(unb64url(tok.slice(1))))); } catch(e){ return null; } }
function decodeOldLink(text){
  const m = text.match(/#p=([A-Za-z0-9+\-$]+)/); if (!m) return null;
  try { return valid(JSON.parse(LZString.decompressFromEncodedURIComponent(m[1]))); } catch(e){ return null; }
}
const base = () => (BASE_URL || location.href).split('#')[0];

/* ---------- speech ----------
   Phones need care: in-app browsers (KakaoTalk, Naver on Android) have no speech at all, iPhone stays
   silent until speech is started once from a tap, and cancelling right before speaking drops the new
   utterance on some phones. */
const synth = window.speechSynthesis;
const canSpeak = !!(synth && window.SpeechSynthesisUtterance);
let voices = [];
function loadVoices(){ try { voices = synth.getVoices() || []; } catch(e){ voices = []; } }
if (canSpeak) { loadVoices(); try { synth.addEventListener('voiceschanged', loadVoices); } catch(e){ synth.onvoiceschanged = loadVoices; } }
const pickVoice = () => voices.find(v => /^en[-_]US/i.test(v.lang) && v.localService) || voices.find(v => /^en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
let unlocked = false;
function unlockSpeech(e){
  if (unlocked || !canSpeak) return; unlocked = true;
  // a first tap that already speaks unlocks by itself; a silent warm-up there would be cancelled and could swallow the word
  if (e && e.target && e.target.closest && e.target.closest('[data-say], #say, .tile.en, .choice, #t-auto')) return;

/* when many students press at once, Apps Script can refuse a request or the sheet can be busy.
   Such requests are sent again after a short, slightly random wait (so they don't all come back together).
   Requests that only read, or are safe to repeat, are also retried after a dropped connection;
   requests that save something are retried only when the server clearly did not run them. */
const SAFE_RETRY = new Set(['adminNotices', 'login', 'me', 'sets', 'teams', 'teamLogin', 'races', 'ranks', 'admin', 'adminLogin', 'adminStudent', 'adminRaces', 'adminBoard', 'raceProgress', 'mySync']);   // mySync merges by time, so sending it twice does no harm
const RETRY_WAIT = [700, 1800];
async function api(action, data){
  if (!API) throw {error: 'config.js에 서버 주소(apiUrl)가 아직 없어요.'};
  const body = JSON.stringify(Object.assign({action}, data || {}));
  for (let attempt = 0; ; attempt++) {
    let res, notRun = false, unsure = false;
    try {
      const r = await fetch(API, {method: 'POST', keepalive: action === 'raceProgress' || action === 'mySync', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body});
      try { res = await r.json(); } catch(e){ notRun = true; }   // an error page instead of an answer: the request did not run
    } catch(e){ unsure = true; }                                // the connection dropped: it may or may not have run
    if (res && res.ok) return res;
    if (res && res.code === 'busy') notRun = true;
    const serverError = !!(res && res.unexpected);   // an unexpected server error, not a message meant for the user
    const again = attempt < RETRY_WAIT.length && (notRun || ((unsure || serverError) && SAFE_RETRY.has(action)));
    if (again) { await new Promise(ok => setTimeout(ok, RETRY_WAIT[attempt] + Math.random() * 500)); continue; }
    if (res && !notRun) throw res;
    if (notRun) throw {error: '지금 접속한 사람이 많아요. 잠시 후 다시 해 주세요.', offline: true};

const fmtTime = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('ko-KR', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}); };
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
function lookupWord(en, page){
  const p = PAGES.find(p => p.id === page) || SETS.find(s => s.id === page);
  return (p && p.w.find(w => w[0] === en)) || ALL.w.find(w => w[0] === en) || SETS.flatMap(s => s.w).find(w => w[0] === en) || [en, '', ''];
}

/* ---------- word text → words: shared by the teacher's editor and by sets saved on the server ---------- */
/* "solely - 오로지, 단지 = only, exclusively" → ["solely", "오로지, 단지", "= only, exclusively"] */
function normMarkers(m){
  return String(m || '').replace(/\s*(=|↔)\s*/g, ' $1 ').replace(/(^|[\s,])(adv|[vna])\)\s*/g, '$1 $2) ').replace(/\s+/g, ' ').trim();
}
function splitMeaning(raw){
  let m = normMarkers(raw), note = '';
  const lead = m.match(/^= ([A-Za-z][A-Za-z ,'’-]*?) (?=[가-힣~(\[])/);
  if (lead) { note = '= ' + lead[1]; m = m.slice(lead[0].length); }
  m = m.replace(/^a\) /, '');
  const k = m.search(/ (=|↔|adv\)|[vna]\)) /);
  if (k >= 0) { note = (note + ' ' + m.slice(k + 1)).trim(); m = m.slice(0, k); }
  return [m.replace(/^[\s,;]+|[\s,;]+$/g, ''), note];
}
const REL_TYPE = {'=': '유의어', '↔': '반의어', 'v)': '동사', 'a)': '형용사', 'n)': '명사', 'adv)': '부사'};
/* note → related words, the same rules used to build words.js */
function relFromNote(note){
  const out = [];
  if (!note) return out;
  for (const part of normMarkers(note).split(/\s(?=(?:=|↔|adv\)|[vna]\))\s)/)) {
    const m = part.match(/^(=|↔|adv\)|[vna]\))\s+(.*)$/); if (!m) continue;
    const type = REL_TYPE[m[1]], rest = m[2].trim(); if (!rest) continue;
    if (type === '유의어') (/\(/.test(rest) ? [rest] : rest.split(/\s*,\s*/)).filter(Boolean).forEach(en => out.push([type, en]));
    else { const k = rest.search(/[가-힣~(\[]/); const en = (k > 0 ? rest.slice(0, k) : rest).trim(), ko = k > 0 ? rest.slice(k).trim() : ''; if (en && ko) out.push([type, en, ko]); }
  }
  return out;
}
/* one line per word: "영어 - 뜻", a tab, a colon, or just English then Korean */
function parseWordLine(line){
  line = line.trim().replace(/^\d+[.)]\s*/, '').replace(/^[-•·]\s*/, '');
  if (!line) return null;
  let en = '', rest = '';
  const tab = line.split('\t');
  if (tab.length >= 2) { en = tab[0]; rest = tab.slice(1).join(' '); }
  else {
    const k = line.search(/\s[-–—:|]\s|[:|]\s/);
    if (k > 0) { en = line.slice(0, k); rest = line.slice(k).replace(/^\s*[-–—:|]\s*/, ''); }
    else { const h = line.search(/[가-힣(~\[]/); if (h > 0) { en = line.slice(0, h); rest = line.slice(h); } }
  }
  en = en.replace(/[,\s]+$/, '').trim(); rest = rest.trim();
  if (!en || !rest || !/[A-Za-z]/.test(en)) return null;
  const [ko, note] = splitMeaning(rest);
  return ko ? (note ? [en, ko, note] : [en, ko]) : null;
}

/* photo text (OCR) → "영어 - 뜻" lines. A worksheet table comes back cell by cell or row by row,

const HEADER_WORDS = /^(단어|뜻|의미|번호|영어|우리말|한글|No\.?|word|words|meaning)$/i;

  String(text || '').replace(/ /g, ' ').split(/\r?\n/).forEach(line => {

    const toks = normMarkers(line.replace(/\t/g, ' ')).split(' ').filter(t => t && !isNumTok(t) && !HEADER_WORDS.test(t));
    if (state === 'note') state = 'afternote';               // a line break ends a related-word part

    .map(e => `${e.en.join(' ').replace(/\s*,$/, '')} - ${e.ko.join(' ')}${e.note.length ? ' ' + e.note.join(' ') : ''}`);

/* photo → smaller JPEG (long side 2000px) so it uploads quickly from a phone */
function shrinkImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 열 수 없어요. JPG나 PNG 사진으로 올려 주세요.')); };
    img.src = url;
  });
}

const CIRCLED = '①②③④⑤⑥';

/* every team gets the same words in the same order: shuffles are seeded by the race id */
function seededRng(seed){
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const seededShuffle = (a, rng) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function sourceWords(id, rel){
  const p = PAGES.find(x => x.id === id) || SETS.find(x => x.id === id);
  if (!p) return [];
  return rel ? p.w : (p.heads || p.w);
}
const sourceName = id => { const p = PAGES.find(x => x.id === id); if (p) return BOOK + ' ' + p.t.replace('학습지 ', ''); const s = SETS.find(x => x.id === id); return s ? s.t : '(지워진 지문)'; };
function raceWords(race){
  const seen = new Set(), out = [];
  (race.sources || []).forEach(id => sourceWords(id, race.settings.rel).forEach(w => { const k = w[0].toLowerCase(); if (!seen.has(k) && w[1]) { seen.add(k); out.push(w); } }));
  let list = seededShuffle(out, seededRng(race.id));
  if (race.settings.count > 0 && race.settings.count < list.length) list = list.slice(0, race.settings.count);
  return list;
}
/* quiz questions in race order, the same for everyone (shuffled by the race id when the teacher asked for it) */
function raceQuiz(race){
  let list = (race.questions || []).map((q, i) => Object.assign({no: i + 1}, q));
  if (race.settings.shuffle) list = seededShuffle(list, seededRng(race.id + ':q'));
  if (race.settings.count > 0 && race.settings.count < list.length) list = list.slice(0, race.settings.count);
  return list;
}
const raceItems = race => race.settings.mode === 'quiz' ? raceQuiz(race) : raceWords(race);
const quizAnswerText = q => q.type === 'choice' ? `${CIRCLED[q.answer] || q.answer + 1} ${q.options[q.answer] || ''}` : q.answer.join(' / ');
const normQ = s => String(s || '').toLowerCase().replace(/[‘’`]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').replace(/^[\s"']+|[\s.!?,;:"']+$/g, '');
/* matching rounds of up to 8 pairs, no repeated word or meaning inside a round */
function matchRounds(words){
  const rounds = []; let rest = words.slice();
  while (rest.length) {
    const r = [], en = new Set(), ko = new Set(), left = [];
    rest.forEach(w => { if (r.length < 8 && !en.has(w[0]) && !ko.has(w[1])) { r.push(w); en.add(w[0]); ko.add(w[1]); } else left.push(w); });
    rounds.push(r); rest = left;
  }
  return rounds;
}
const fmtSec = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return m ? `${m}분 ${r.toFixed(1).padStart(4, '0')}초` : `${r.toFixed(1)}초`; };
/* Quiz scored by accuracy: answer each question once within the time limit, ranked by how many are right */
const isAcc = race => race.settings.mode === 'quiz' && race.settings.scoring === 'acc';
const pctOf = (n, t) => t ? Math.round(n / t * 100) + '%' : '–';
const raceRule = race => isAcc(race) ? ` · 정확도${race.settings.limit ? ` · 제한 ${race.settings.limit}분` : ''}` : (race.settings.penalty ? ` · 틀리면 +${race.settings.penalty}초` : '');

/* a race button for the team list and for a student's first screen */
function raceTile(x){

}
const myRacesHTML = () => { const list = myRacesList();
  if (isTeacher() && !list.length) return `<div class="section-label" id="myraces-h">레이스</div><div class="panel empty" id="myraces">${AUTH.cls ? `${esc(AUTH.cls)} 학생에게 보이는 레이스가 없어요. 레이스 탭에서 이 반에 연 개인 레이스만 여기에 나와요.` : '위에서 반을 고르면 그 반 학생에게 보이는 레이스가 여기에 나와요.'}</div>`;
  return list.length ? `<div class="section-label" id="myraces-h">레이스</div><div class="pages" id="myraces">${list.map(raceTile).join('')}</div>` : ''; };
/* draw the student's race buttons from the saved copy, then check the server and redraw if something changed */
function bindMyRaces(redraw){
  $app.querySelectorAll('#myraces [data-race]').forEach(b => b.onclick = () => viewRaceReady(myRacesList().find(x => x.id === b.dataset.race), isTeacher() ? teacherRaceCtx() : studentCtx()));
  const snap = () => JSON.stringify([myRacesList(), isTeacher() ? store.get(TCLS_KEY, null) : 0]);   // the teacher's class list can arrive too
  const before = snap(), mk = 'v-myr-' + (++VIEWSEQ);
  $app.insertAdjacentHTML('beforeend', '<i hidden id="' + mk + '"></i>');
  loadMyRaces().then(() => {
    if (snap() === before || !document.getElementById(mk)) return;   // nothing new, or the student has moved on
    const y = scrollY; redraw(); scrollTo(0, y);
  });
}

function viewRaceReady(race, ctx){
  stopTimers();
  if (!race) return ctx.home();
  const items = raceItems(race), m = race.mine, resume = !ctx.trial && m && m.status !== '완료';
  const rule = ctx.trial ? '풀어보기는 기록되지 않아요.' : race.settings.multi ? '여러 번 도전할 수 있어요. 순위는 가장 좋은 기록으로 매겨요.' : (ctx.kind === 'team' ? '모둠당 한 번만 할 수 있어요.' : '한 번만 할 수 있어요.');
  $app.innerHTML = `${header(`<button class="link" id="back">${ctx.backText}</button>`)}
  <div class="setcard"><div class="eyebrow">${esc(ctx.label)}</div><h1>${esc(race.name)}</h1><div class="meta">${MODE_NAME[race.settings.mode]} · ${items.length}문제${raceRule(race)}</div></div>
  <div class="panel" style="padding:18px;display:flex;flex-direction:column;gap:8px">
    <p style="margin:0">${isAcc(race) ? `문제마다 한 번씩 답을 골라요. 다 풀기 전에는 이전 문제로 돌아가 고칠 수 있어요.<br>${race.settings.limit ? `<b>제한 시간 ${race.settings.limit}분</b>이 지나면 그때까지 쓴 답으로 저절로 제출돼요. ` : ''}맞힌 개수로 순위를 매기고, 같으면 빨리 낸 쪽이 앞서요. 정답과 해설은 제출한 뒤에 보여요.` : MODE_HELP[race.settings.mode]}</p>
    <p class="help" style="margin:0">${resume ? '하던 레이스를 이어서 해요. 시간은 처음 출발한 때부터 계속 흘러요.' : '출발을 누르면 3초 뒤 시작해요. ' + rule}</p>
    ${race.settings.mode === 'quiz' ? '' : `<p class="help" style="margin:0">출처: ${race.sources.map(sourceName).map(esc).join(' + ')}</p>`}
    ${m && m.best != null && !resume ? `<p class="help" style="margin:0">지금까지 최고 기록 <b>${isAcc(race) ? `${m.bestDone}/${m.bestTotal} (${pctOf(m.bestDone, m.bestTotal)})` : fmtSec(m.best)}</b> · ${m.finished}번 도전</p>` : ''}
  </div>
  <button class="btn mark" id="go" style="font-size:20px;padding:18px" ${items.length ? '' : 'disabled'}>${resume ? '이어 하기' : '출발!'}</button>`;
  document.getElementById('back').onclick = () => ctx.home();
  document.getElementById('go').onclick = async e => {
    e.target.disabled = true; e.target.textContent = '준비하는 중…';
    let st;
    try { st = await raceApi(ctx, 'raceStart', {race: race.id, total: items.length}); }
    catch(err){ if (err.code === 'auth') return ctx.authFail(); toast(err.error || '출발하지 못했어요'); return ctx.home(); }
    if (ctx.kind === 'student') myRacesStale();   // the first screen should show "이어 하기" if the student comes back mid-race
    if (st.resumed) return runRace(race, items, st, ctx);
    let n = 3;
    $app.innerHTML = `<div class="countdown" id="cd">${n}</div>`;
    const t = setInterval(() => { n--; if (n > 0) document.getElementById('cd').textContent = n; else { clearInterval(t); runRace(race, items, {elapsed: 0, done: 0, wrong: 0, penalty: 0}, ctx); } }, 800);
    timers.push(t);
  };
  scrollTo(0, 0);
}

/* ---------- the race itself ---------- */
function runRace(race, words, st, ctx){
  stopTimers();
  const S = race.settings, P = S.penalty || 0, total = words.length;
  const t0 = performance.now() - (st.elapsed || 0) * 1000;
  const R = {done: st.done || 0, wrong: st.wrong || 0, penalty: st.penalty || 0, wrongWords: [], qres: {}, resumedAt: st.done || 0};
  // the wait for "출발" counted on the server too, so a resumed race keeps the same clock
  const elapsed = () => (performance.now() - t0) / 1000 + R.penalty;
  // progress goes to the server at most every 2 seconds, and always once more after the last answer
  let lastSent = 0, sending = false, again = false, pending = null, finished = false;
  const push = () => {
    if (finished) return;
    if (sending) { again = true; return; }
    sending = true; lastSent = Date.now();
    raceApi(ctx, 'raceProgress', {race: race.id, done: R.done, wrong: R.wrong, penalty: R.penalty}).catch(() => {})
      .finally(() => { sending = false; if (again) { again = false; send(); } });
  };
  const send = force => {
    if (finished) return;
    const wait = 2000 - (Date.now() - lastSent);
    if (force || wait <= 0) { if (pending) { clearTimeout(pending); pending = null; } push(); }
    else if (!pending) { pending = setTimeout(() => { pending = null; push(); }, wait); timers.push(pending); }
  };
  const onHide = () => { if (document.visibilityState === 'hidden') send(true); };
  document.addEventListener('visibilitychange', onHide);
  timers.push({off: () => document.removeEventListener('visibilitychange', onHide)});
  const miss = w => { R.wrong++; R.penalty += P; if (w && !R.wrongWords.includes(w[0])) R.wrongWords.push(w[0]); const tm = document.getElementById('rtime'); if (tm && P) { tm.classList.add('pen'); setTimeout(() => tm.classList.remove('pen'), 450); } send(); };
  const top = () => `<div class="racehead"><div><div class="count">${esc(ctx.label)}</div><b>${esc(race.name)}</b></div><div class="rtime" id="rtime">${fmtSec(elapsed())}</div></div>
    <div class="bar"><i id="rbar" style="width:${total ? R.done / total * 100 : 0}%"></i></div><div class="count" id="rcount">${R.done} / ${total}${R.wrong ? ` · 틀림 ${R.wrong}` : ''}</div>`;
  const tick = setInterval(() => { const tm = document.getElementById('rtime'); if (tm) tm.textContent = fmtSec(elapsed()); }, 100); timers.push(tick);
  const prog = () => { const b = document.getElementById('rbar'), c = document.getElementById('rcount'); if (b) b.style.width = (R.done / total * 100) + '%'; if (c) c.textContent = `${R.done} / ${total}${R.wrong ? ` · 틀림 ${R.wrong}` : ''}`; };
  const finish = async () => {
    finished = true; stopTimers();
    $app.innerHTML = `<div class="countdown small">도착!</div><div class="panel empty" style="text-align:center">${ctx.trial ? '' : '기록을 저장하는 중…'}</div>`;
    let r = null;
    for (let k = 0; k < 3 && !r; k++) { try { r = await raceApi(ctx, 'raceFinish', {race: race.id, done: R.done, wrong: R.wrong, penalty: R.penalty, wrongWords: R.wrongWords}); } catch(e){ if (e.code === 'auth') break; await new Promise(z => setTimeout(z, 1500)); } }
    if (ctx.kind === 'student') myRacesStale();
    viewRaceResult(race, r, R, elapsed(), ctx, words);
  };

  if (S.mode === 'quiz' && S.scoring === 'acc') return accQuiz();
  if (S.mode === 'quiz') return quizRace();
  if (S.mode === 'match') return matchRace();
  if (S.mode === 'spell') return spellRace();
  return timeRace();

  function timeRace(){
    const draw = () => {
      if (R.done >= total) return finish();
      const w = words[R.done], rng = seededRng(race.id + ':' + R.done), toKo = rng() < .5;
      const answer = toKo ? w[1] : w[0], seen = new Set([answer]), pick = [];
      for (const x of seededShuffle(words, rng)) { const t = toKo ? x[1] : x[0]; if (x !== w && x[1] !== w[1] && !seen.has(t)) { seen.add(t); pick.push(t); } if (pick.length === 3) break; }
      const opts = seededShuffle([answer, ...pick], rng);
      $app.innerHTML = `${top()}
      <div class="card" style="min-height:150px">${toKo ? `<div class="big">${esc(w[0])}</div><div class="hint">알맞은 뜻을 고르세요</div>` : `<div class="ko big-ko">${esc(w[1])}</div><div class="hint">알맞은 영어 단어를 고르세요</div>`}</div>
      <div class="choices">${opts.map((o, k) => `<button class="choice${toKo ? '' : ' en'}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
      $app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        if (opts[+b.dataset.k] === answer) {
          b.classList.add('ok'); $app.querySelectorAll('.choice').forEach(c => c.disabled = true);
          R.done++; prog(); send(); timers.push(setTimeout(draw, 250));
        } else { b.classList.add('no'); b.disabled = true; miss(w); prog(); }
      });
    };
    draw();
  }

  function spellRace(){
    const draw = () => {
      if (R.done >= total) return finish();
      const w = words[R.done], key = plain(w[0]); let extra = 0;
      const firsts = new Set(); key.replace(/[A-Za-z]+/g, (m, off) => { firsts.add(off); return m; });
      const mask = () => { let seen = 0; return key.split('').map((ch, k) => { if (!/[A-Za-z]/.test(ch)) return ch === ' ' ? ' ' : ch; seen++; return firsts.has(k) || seen <= extra + 1 ? ch : '_'; }).join(' '); };
      $app.innerHTML = `${top()}
      <div class="card" style="min-height:150px"><div class="ko big-ko">${esc(w[1])}</div><div class="mask" id="hn">${esc(mask())}</div></div>
      <form id="fm" class="row" style="flex-direction:column;align-items:stretch" autocomplete="off">
        <input class="answer" id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 쓰세요" aria-label="영어 답">
        <div class="feedback" id="fb"></div>
        <div class="row"><button type="button" class="btn ghost" id="skip">건너뛰기${P ? ` (+${P * 3}초)` : ''}</button><button type="submit" class="btn mark wide">확인</button></div>
      </form>`;
      const ans = document.getElementById('ans'), fb = document.getElementById('fb');
      timers.push(setTimeout(() => ans.focus(), 30));
      document.getElementById('fm').onsubmit = e => {
        e.preventDefault(); if (!ans.value.trim()) return;
        if (norm(ans.value) === norm(w[0])) { R.done++; prog(); send(); fb.className = 'feedback ok'; fb.textContent = '정답!'; timers.push(setTimeout(draw, 300)); return; }
        miss(w); prog();
        extra = Math.min(extra + 1, key.replace(/[^A-Za-z]/g, '').length - 1);
        document.getElementById('hn').textContent = mask();
        fb.className = 'feedback no'; fb.textContent = '다시 써 보세요. 한 글자를 더 보여 줄게요.';
        ans.classList.add('no'); setTimeout(() => ans.classList.remove('no'), 400); ans.select();
      };
      document.getElementById('skip').onclick = () => {
        R.wrong++; R.penalty += P * 3; if (!R.wrongWords.includes(w[0])) R.wrongWords.push(w[0]);
        fb.className = 'feedback no'; fb.innerHTML = `정답: <span style="font-family:var(--f-word)">${esc(w[0])}</span>`;
        R.done++; prog(); send(); timers.push(setTimeout(draw, 1300));
      };
    };
    draw();
  }

  function matchRace(){
    const rounds = matchRounds(words);
    let ri = 0, before = 0;
    while (ri < rounds.length && before + rounds[ri].length <= R.done) { before += rounds[ri].length; ri++; }
    R.done = before;   // a resumed race restarts the round it was in
    const play = () => {
      if (ri >= rounds.length) return finish();
      const pool = rounds[ri];
      const tiles = seededShuffle(pool.flatMap((w, n) => [{n, t: w[0], en: true}, {n, t: w[1], en: false}]), seededRng(race.id + ':m' + ri));
      let sel = null, matched = 0;
      $app.innerHTML = `${top()}<div class="count">${ri + 1}/${rounds.length}판</div>
      <div class="match" id="mg" style="--cols:${pool.length > 4 ? 4 : 2}">${tiles.map((x, k) => `<button class="tile${x.en ? ' en' : ''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>`;
      document.getElementById('mg').onclick = e => {
        const b = e.target.closest('.tile'); if (!b || b.classList.contains('gone')) return;
        const x = tiles[+b.dataset.k];
        if (!sel) { sel = b; b.classList.add('sel'); return; }
        if (sel === b) { b.classList.remove('sel'); sel = null; return; }
        const y = tiles[+sel.dataset.k];
        if (x.en === y.en) { sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
        if (x.n === y.n) {
          [sel, b].forEach(t => { t.classList.remove('sel'); t.classList.add('ok'); setTimeout(() => t.classList.add('gone'), 200); });
          sel = null; matched++; R.done++; prog(); send();
          if (matched === pool.length) { ri++; timers.push(setTimeout(play, 350)); }
        } else {
          const a = sel; [a, b].forEach(t => { t.classList.remove('sel'); t.classList.add('no'); setTimeout(() => t.classList.remove('no'), 400); });
          sel = null; miss(pool[(x.en ? x : y).n]); prog();
        }
      };
    };
    play();
  }

  /* the teacher's questions: choose an option, or type a short answer. A wrong answer adds the penalty and
     the student tries again; the first try decides whether it counts as right on the result screen */
  function quizRace(){
    const draw = () => {
      if (R.done >= total) return finish();
      const i = R.done, q = words[i], label = [q.no + '번'];
      const mark = v => { if (!R.qres[i]) R.qres[i] = v; };
      const passage = q.passage ? `<div class="qpass">${esc(q.passage)}</div>` : '';
      const head = `<div class="qtext"><span class="qno">${i + 1}.</span> ${esc(q.q)}</div>`;
      const next = () => { R.done++; prog(); send(); timers.push(setTimeout(draw, 350)); };
      if (q.type === 'choice') {
        $app.innerHTML = `${top()}<div class="card qcard">${passage}${head}</div>
        <div class="choices">${q.options.map((o, k) => `<button class="choice qopt" data-k="${k}"><span class="qnum">${CIRCLED[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
        $app.querySelectorAll('.qopt').forEach(b => b.onclick = () => {
          if (+b.dataset.k === q.answer) { mark('ok'); b.classList.add('ok'); $app.querySelectorAll('.qopt').forEach(c => c.disabled = true); next(); }
          else { mark('wrong'); b.classList.add('no'); b.disabled = true; miss(label); prog(); }
        });
      } else {
        $app.innerHTML = `${top()}<div class="card qcard">${passage}${head}</div>
        <form id="fm" class="row" style="flex-direction:column;align-items:stretch" autocomplete="off">
          <input class="answer" id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="답을 쓰세요" aria-label="답">
          <div class="feedback" id="fb"></div>
          <div class="row"><button type="button" class="btn ghost" id="skip">건너뛰기${P ? ` (+${P * 3}초)` : ''}</button><button type="submit" class="btn mark wide">확인</button></div>
        </form>`;
        const ans = document.getElementById('ans'), fb = document.getElementById('fb');
        timers.push(setTimeout(() => ans.focus(), 30));
        document.getElementById('fm').onsubmit = e => {
          e.preventDefault(); if (!ans.value.trim()) return;
          if (q.answer.some(a => normQ(a) === normQ(ans.value))) { mark('ok'); fb.className = 'feedback ok'; fb.textContent = '정답!'; ans.readOnly = true; next(); return; }
          mark('wrong'); miss(label); prog();
          fb.className = 'feedback no'; fb.textContent = '다시 생각해 보세요.';
          ans.classList.add('no'); setTimeout(() => ans.classList.remove('no'), 400); ans.select();
        };
        document.getElementById('skip').onclick = () => {
          mark('skip'); R.wrong++; R.penalty += P * 3; if (!R.wrongWords.includes(label[0])) R.wrongWords.push(label[0]);
          next();
        };
      }
      scrollTo(0, 0);
    };
    draw();
  }

  /* accuracy Quiz: one answer per question, free to move back and forth, submitted at the end or when time runs out.
     Answers are kept in this browser too, so a refresh or a closed screen picks up where the student was */
  function accQuiz(){
    const LIM = (S.limit || 0) * 60, akey = ctx.trial ? '' : 'wordroom-acc-' + race.id + '-' + ctx.label;
    let ans = {}; try { if (akey && st.resumed) ans = JSON.parse(localStorage.getItem(akey) || '{}') || {}; } catch(e){}
    const keep = () => { if (akey) try { localStorage.setItem(akey, JSON.stringify(ans)); } catch(e){} };
    const answered = () => Object.keys(ans).filter(k => String(ans[k]).trim() !== '').length;
    let cur = 0, submitted = false;
    const left = () => LIM ? Math.max(0, LIM - (performance.now() - t0) / 1000) : null;
    const clock = () => LIM ? `<span class="rtlabel">남은 시간</span>${fmtSec(left())}` : fmtSec((performance.now() - t0) / 1000);
    const head = () => `<div class="racehead"><div><div class="count">${esc(ctx.label)}</div><b>${esc(race.name)}</b></div><div class="rtime" id="rtime">${clock()}</div></div>
      <div class="bar"><i id="rbar" style="width:${total ? answered() / total * 100 : 0}%"></i></div>
      <div class="qdots">${words.map((q, i) => `<button class="qdot${i === cur ? ' on' : ''}${String(ans[i] ?? '').trim() !== '' ? ' done' : ''}" data-go="${i}" aria-label="${i + 1}번">${i + 1}</button>`).join('')}</div>`;
    clearInterval(tick);
    timers.push(setInterval(() => {
      const tm = document.getElementById('rtime'); if (tm) tm.innerHTML = clock();
      if (LIM && left() < 60 && tm) tm.classList.add('pen');
      if (LIM && left() <= 0 && !submitted) submit(true);
    }, 250));
    const draw = () => {
      const q = words[cur];
      const passage = q.passage ? `<div class="qpass">${esc(q.passage)}</div>` : '';
      const body = q.type === 'choice'
        ? `<div class="choices">${q.options.map((o, k) => `<button class="choice qopt${ans[cur] === k ? ' sel' : ''}" data-k="${k}"><span class="qnum">${CIRCLED[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`
        : `<input class="answer" id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="답을 쓰세요" aria-label="답" value="${esc(ans[cur] || '')}">`;
      $app.innerHTML = `${head()}<div class="card qcard">${passage}<div class="qtext"><span class="qno">${cur + 1}.</span> ${esc(q.q)}</div></div>${body}
        <div class="row"><button class="btn ghost" id="qprev" ${cur ? '' : 'disabled'}>‹ 이전</button>${cur < total - 1 ? '<button class="btn mark wide" id="qnext">다음 ›</button>' : '<button class="btn mark wide" id="qsubmit">제출하기</button>'}</div>
        <div class="count" id="qleft">${answered()} / ${total}문제 답함</div>`;
      $app.querySelectorAll('.qopt').forEach(b => b.onclick = () => { ans[cur] = +b.dataset.k; keep(); upd(); $app.querySelectorAll('.qopt').forEach(c => c.classList.toggle('sel', c === b)); });
      const inp = document.getElementById('ans');
      if (inp) { inp.oninput = () => { ans[cur] = inp.value; keep(); upd(); }; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + 1); } }; timers.push(setTimeout(() => inp.focus(), 30)); }
      $app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
      const pv = document.getElementById('qprev'); if (pv) pv.onclick = () => go(cur - 1);
      const nx = document.getElementById('qnext'); if (nx) nx.onclick = () => go(cur + 1);
      const sb = document.getElementById('qsubmit'); if (sb) sb.onclick = () => submit(false);
      scrollTo(0, 0);
    };
    const upd = () => {
      R.done = answered(); prog(); send();
      const b = document.getElementById('rbar'); if (b) b.style.width = (R.done / total * 100) + '%';
      const l = document.getElementById('qleft'); if (l) l.textContent = `${R.done} / ${total}문제 답함`;
      const d = $app.querySelector(`.qdot[data-go="${cur}"]`); if (d) d.classList.toggle('done', String(ans[cur] ?? '').trim() !== '');
    };
    const go = i => { if (i < 0) return; if (i >= total) return submit(false); cur = i; draw(); };
    const submit = timeUp => {
      if (submitted) return;
      const blank = total - answered();
      if (!timeUp && blank) {
        const sb = document.getElementById('qsubmit') || document.getElementById('qnext');
        if (sb && sb.dataset.sure !== '1') { if (!document.getElementById('qsubmit')) { cur = total - 1; draw(); } const b = document.getElementById('qsubmit'); b.dataset.sure = '1'; b.textContent = `답하지 않은 문제 ${blank}개 · 그래도 제출`; return; }
      }
      submitted = true;
      let right = 0;
      words.forEach((q, i) => {
        const a = ans[i], empty = a === undefined || String(a).trim() === '';
        const ok = !empty && (q.type === 'choice' ? a === q.answer : q.answer.some(x => normQ(x) === normQ(a)));
        R.qres[i] = empty ? 'blank' : ok ? 'ok' : 'wrong'; R.mine = R.mine || {}; R.mine[i] = a;
        if (ok) right++; else R.wrongWords.push((q.no || i + 1) + '번');
      });
      R.done = right; R.wrong = total - right; R.penalty = 0; R.timeUp = !!timeUp;
      if (akey) try { localStorage.removeItem(akey); } catch(e){}
      finish();
    };
    if (st.resumed && st.elapsed && LIM && st.elapsed >= LIM) return submit(true);
    draw();
  }
}

function viewRaceResult(race, r, R, localSec, ctx, items){
  if (isAcc(race)) return viewAccResult(race, r, R, localSec, ctx, items);
  stopTimers();

  const multi = race.settings.multi && !ctx.trial;

  const where = ctx.kind === 'team' ? TEAM.cls : '우리 반';

    ${r || ctx.trial ? '' : '<div class="savestate wait">기록을 저장하지 못했어요. 선생님께 말씀드리세요.</div>'}
  </div>
  ${quiz ? `<div class="section-label">정답과 해설</div><div class="panel"><ol class="qres">${items.map((q, i) => `<li>
      <div class="row" style="gap:8px"><b>${i + 1}번</b>${qmark(i)}</div>
      <div class="qtext small">${esc(q.q)}</div>
      <div class="small">정답: <b>${esc(quizAnswerText(q))}</b></div>
      ${q.exp ? `<div class="qexp">${esc(q.exp)}</div>` : ''}</li>`).join('')}</ol></div>`
    : R.wrongWords.length ? `<div class="section-label">헷갈린 단어 ${R.wrongWords.length}개</div><div class="panel"><ul class="wl">${R.wrongWords.map(en => wordRow(raceWords(race).find(w => w[0] === en) || [en, ''])).join('')}</ul></div>` : ''}
  <div class="row">${multi && race.status === '진행' ? '<button class="btn ghost" id="again">다시 도전</button>' : ''}<button class="btn wide" id="home">${ctx.homeText}</button></div>`;
  document.getElementById('home').onclick = () => ctx.home();
  const ag = document.getElementById('again');
  if (ag) ag.onclick = () => viewRaceReady(Object.assign({}, race, {mine: null}), ctx);
  scrollTo(0, 0);
}

function viewAccResult(race, r, R, localSec, ctx, items){
  stopTimers();
  const total = items.length, right = R.done, sec = r && r.seconds != null ? r.seconds : localSec;
  const multi = race.settings.multi && !ctx.trial, unit = ctx.kind === 'team' ? '모둠' : '명', where = ctx.kind === 'team' ? TEAM.cls : '우리 반';
  const mark = i => R.qres[i] === 'ok' ? '<span class="chip ok">맞힘</span>' : R.qres[i] === 'blank' ? '<span class="chip">답 안 함</span>' : '<span class="chip">틀림</span>';
  const mineText = (q, i) => { const a = (R.mine || {})[i]; if (a === undefined || String(a).trim() === '') return '(답 안 함)'; return q.type === 'choice' ? `${CIRCLED[a] || ''} ${q.options[a] || ''}` : a; };
  $app.innerHTML = `${header()}
  <div class="setcard"><div class="eyebrow">${esc(ctx.label)}</div><h1>${R.timeUp ? '시간이 다 됐어요' : '제출했어요'}</h1><div class="meta">${esc(race.name)}</div></div>
  <div class="panel" style="padding:24px;display:flex;flex-direction:column;gap:6px;align-items:flex-start">
    <div class="count">${multi ? '이번 점수' : '점수'}</div><div class="score">${right}<small> / ${total}</small> <small>· 정답률 ${pctOf(right, total)}</small></div>
    <div class="help">걸린 시간 ${fmtSec(sec)}${multi && r && r.bestDone != null && (r.bestDone > right) ? ` · 최고 점수 <b>${r.bestDone}/${total}</b>` : ''}${r && !ctx.trial && race.settings.showRank && r.rank ? ` · <b>${esc(where)} ${r.rank}위</b> (지금까지 ${r.of}${unit})` : ''}</div>
    ${r || ctx.trial ? '' : '<div class="savestate wait">기록을 저장하지 못했어요. 선생님께 말씀드리세요.</div>'}
  </div>
  <div class="section-label">정답과 해설</div><div class="panel"><ol class="qres">${items.map((q, i) => `<li>
      <div class="row" style="gap:8px"><b>${i + 1}번</b>${mark(i)}</div>
      <div class="qtext small">${esc(q.q)}</div>
      <div class="small">내 답: ${esc(mineText(q, i))}</div>
      <div class="small">정답: <b>${esc(quizAnswerText(q))}</b></div>
      ${q.exp ? `<div class="qexp">${esc(q.exp)}</div>` : ''}</li>`).join('')}</ol></div>
  <div class="row">${multi && race.status === '진행' ? '<button class="btn ghost" id="again">다시 도전</button>' : ''}<button class="btn wide" id="home">${ctx.homeText}</button></div>`;
  document.getElementById('home').onclick = () => ctx.home();
  const ag = document.getElementById('again');
  if (ag) ag.onclick = () => viewRaceReady(Object.assign({}, race, {mine: null}), ctx);
  scrollTo(0, 0);
}

   선생님: 반·모둠 등록, 레이스 만들기, 순위판

/* 지난 레이스 기록 정리: N일 지난 레이스 기록을 '지난 레이스 기록' 탭으로 */
function archivePanel(a){
  if (!a) return '';
  const opts = [7, 14, 21, 28], days = opts.includes(a.days) ? a.days : 28;
  return `<div class="panel archive"><div><b>지난 레이스 기록 정리</b><div class="muted small">오래된 레이스 기록을 구글 시트 '지난 레이스 기록' 탭으로 옮겨 순위판을 가볍게 해요. 옮긴 기록도 시트에 그대로 남아요.</div></div>
    <div class="row small"><label for="ar-days" class="small">기준</label><select id="ar-days">${opts.map(d => `<option value="${d}" ${d === days ? 'selected' : ''}>${d}일 지난 기록</option>`).join('')}</select>
      <label class="check small"><input type="checkbox" id="ar-auto" ${a.auto ? 'checked' : ''}><span>매일 새벽 자동으로 옮기기</span></label></div>
    <div class="row small"><button class="btn ghost small" id="ar-save">설정 저장</button><button class="btn ghost small" id="ar-now">지금 옮기기</button>
      <span class="muted small" id="ar-msg">레이스 기록 ${a.raceRows}줄 · 지난 레이스 기록 ${a.oldRows}줄${a.last ? ` · 마지막 정리 ${esc(fmtTime(a.last))}` : ''}</span></div></div>`;
}
function bindArchivePanel(){
  const $ = id => document.getElementById(id); if (!$('ar-save')) return;
  const go = async (now, btn) => {
    if (now && btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = `정말 ${$('ar-days').value}일 지난 기록 옮기기`; return; }
    btn.disabled = true;
    try {
      const r = await api('adminArchive', {token: ADMIN.token, days: +$('ar-days').value, auto: $('ar-auto').checked, save: true, now});
      RACE_ADMIN.archive = r.archive; store.set('wordroom-raceadmin', RACE_ADMIN);
      toast(now ? `레이스 기록 ${r.moved.race}줄을 옮겼어요` : ($('ar-auto').checked ? '매일 새벽 3시쯤 자동으로 옮겨요' : '설정을 저장했어요'));
      viewRaceAdmin();
    } catch(e){ btn.disabled = false; if (!adminErr(e, viewRaceAdmin)) toast(e.error || '하지 못했어요'); }
  };
  $('ar-save').onclick = e => go(false, e.target);
  $('ar-now').onclick = e => go(true, e.target);
}
let RACE_ADMIN = {classes: [], studentClasses: [], races: []};
/* the classes a race is for: "전체 반" means every registered class (team races) or every class found in student numbers (individual races) */
const whoClasses = (who, data) => who === 'student' ? ((data || RACE_ADMIN).studentClasses || []).map(c => c.name) : ((data || RACE_ADMIN).classes || []).map(c => c.name);
const raceClassNames = (race, teams) => race.classes.includes('*') ? (teams ? teams.map(c => c.name) : whoClasses(race.settings.who)) : race.classes;
const raceClassLabel = race => race.classes.includes('*') ? '전체 반' : race.classes.join(', ');
async function loadRaceAdmin(){ const r = await api('adminRaces', {token: ADMIN.token, v: setsV()}); applySets(r.setsPack); RACE_ADMIN = {classes: r.classes, studentClasses: r.studentClasses || [], races: r.races, archive: r.archive}; return r; }
const STATUS_CHIP = {'준비': '<span class="chip">준비</span>', '진행': '<span class="chip go">열림</span>', '마감': '<span class="chip">마감</span>'};
/* one chip for the whole race: the same state in every class, or "반마다 다름" */
function raceStateChip(race){
  const names = raceClassNames(race);
  const sts = [...new Set((names.length ? names : ['*']).map(c => raceStatusFor(race, c)))];
  return sts.length === 1 ? (STATUS_CHIP[sts[0]] || '') : `<span class="chip run">${sts.includes('진행') ? '일부 반 열림' : '반마다 다름'}</span>`;
}
async function setRaceStatus(race, cls, status, after){
  try { await api('adminRaceStatus', {token: ADMIN.token, id: race.id, cls, status}); toast(`${cls === '*' ? '모든 반' : cls}: ${status === '진행' ? '열었어요' : '마감했어요'}`); after(); }
  catch(e){ if (!adminErr(e, after)) toast(e.error || '바꾸지 못했어요'); }
}

  if (!C.length) C = [{name: '', teams: []}];

}

/* ---------- quiz questions: pasted text → questions ----------
   지문: …            (선택. 다음 "지문:"이 나올 때까지 뒤의 문제에 함께 붙어요)
   1. 문제 …
   ① 보기 ② 보기 …   (보기가 있으면 선다형, 없으면 단답형)
   정답: ② / spend / spending
   해설: …                                                                  */
function parseQuizText(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const out = [], bad = [];
  let passage = '', inPassage = false, cur = null, field = null;
  const optRe = /^\s*(?:[①②③④⑤⑥]|\(\s*[1-6]\s*\)|[A-Fa-f][.)])\s*/;
  const flush = () => { if (cur) { out.push(cur); cur = null; } field = null; };
  lines.forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    let m;
    if ((m = /^\s*(?:\[?지문\]?\s*[:：]|\[지문\])\s*(.*)$/.exec(line))) { flush(); passage = m[1]; inPassage = true; return; }
    if ((m = /^\s*(\d{1,3})\s*[.)번]\s*(.*)$/.exec(line)) && !/^\s*\d+\)\s*$/.test(line)) { flush(); inPassage = false; cur = {type: 'text', passage: passage.trim(), q: m[2], options: [], answerRaw: '', exp: ''}; field = 'q'; return; }
    if (inPassage) { passage += '\n' + line; return; }
    if (!cur) { if (line.trim()) bad.push(line.trim()); return; }
    if ((m = /^\s*(?:정답|답)\s*[:：]\s*(.*)$/.exec(line))) { cur.answerRaw = m[1].trim(); field = 'answer'; return; }
    if ((m = /^\s*(?:해설|풀이|설명)\s*[:：]\s*(.*)$/.exec(line))) { cur.exp = m[1]; field = 'exp'; return; }
    if (optRe.test(line) && field !== 'exp') {
      // one line may hold several options: ① a ② b ③ c
      line.split(/(?=[①②③④⑤⑥])/).map(s => s.replace(optRe, '').trim()).filter(Boolean).forEach(o => cur.options.push(o));
      field = 'opt'; return;
    }
    if (field === 'exp') cur.exp += '\n' + line;
    else if (field === 'q') cur.q += '\n' + line;
    else if (field === 'opt' && line.trim() && cur.options.length) cur.options[cur.options.length - 1] += ' ' + line.trim();
  });
  flush();
  const qs = out.map(c => {
    const q = {passage: c.passage, q: c.q.trim(), exp: c.exp.trim()};
    if (c.options.length >= 2) {
      q.type = 'choice'; q.options = c.options.slice(0, 6);
      const a = c.answerRaw.trim(); let k = '①②③④⑤⑥'.indexOf(a[0]);
      if (k < 0 && /^\(?\d/.test(a)) k = parseInt(a.replace(/\D/g, ''), 10) - 1;
      if (k < 0 && /^[A-Fa-f](\b|[.)])/.test(a)) k = a.toUpperCase().charCodeAt(0) - 65;
      if (k < 0) k = q.options.findIndex(o => normQ(o) === normQ(a));
      q.answer = k >= 0 && k < q.options.length ? k : -1;
    } else {
      q.type = 'text'; q.answer = c.answerRaw.split(/\s*\/\s*|\s+또는\s+/).map(s => s.trim()).filter(Boolean);
    }
    return q;
  });
  return {questions: qs, bad};
}
const quizProblem = q => !q.q ? '문제가 비어 있어요' : q.type === 'choice' ? (q.options.filter(Boolean).length < 2 ? '보기가 2개 이상 있어야 해요' : !(q.answer >= 0 && q.options[q.answer]) ? '정답 보기를 골라 주세요' : '') : (!q.answer.length ? '정답을 써 주세요' : '');

    else q.answer = el.querySelector('[data-qans]').value.split(/\s*\/\s*/).map(x => x.trim()).filter(Boolean);

      : '<div class="panel empty">아직 문제가 없어요. 아래 버튼으로 하나씩 넣거나, 여러 문제를 한꺼번에 붙여 넣으세요.</div>';

    act('[data-qdown]', i => { [Q[i + 1], Q[i]] = [Q[i], Q[i + 1]]; });
    act('[data-qdel]', i => { Q.splice(i, 1); });
    act('[data-qtype]', i => { const q = Q[i]; if (q.type === 'choice') { q.type = 'text'; q.answer = q.answer >= 0 && q.options[q.answer] ? [q.options[q.answer]] : []; } else { q.type = 'choice'; q.options = (q.answer || []).slice(0, 1); q.answer = q.options.length ? 0 : -1; } });
  };
  const addQ = type => { readQ(); Q.push(type === 'choice' ? {type, passage: Q.length ? Q[Q.length - 1].passage : '', q: '', options: [], answer: -1, exp: ''} : {type, passage: Q.length ? Q[Q.length - 1].passage : '', q: '', answer: [], exp: ''}); drawQ(); upd(); const last = $app.querySelectorAll('.qed [data-qq]'); if (last.length) last[last.length - 1].focus(); };
  $('q-add-c').onclick = () => addQ('choice');
  $('q-add-t').onclick = () => addQ('text');
  $('qparse').onclick = () => {
    const r = parseQuizText($('qbulk').value);
    if (!r.questions.length) { $('qparse-msg').textContent = '문제를 찾지 못했어요. "1." 처럼 번호로 시작했는지 확인해 주세요.'; return; }
    readQ(); Q = Q.concat(r.questions); drawQ(); upd();
    const probs = r.questions.filter(q => quizProblem(q)).length;
    $('qparse-msg').textContent = `${r.questions.length}문제를 넣었어요.${probs ? ` 정답을 확인할 문제가 ${probs}개 있어요.` : ''}`;
    $('qbulk').value = '';
  };

  /* classes: registered team classes for team races, classes from student numbers for individual races */
  const drawClasses = () => {
    const list = who === 'student' ? (RACE_ADMIN.studentClasses || []).map(c => ({name: c.name, sub: c.n + '명'})) : RACE_ADMIN.classes.map(c => ({name: c.name, sub: c.teams.length + '모둠'}));
    $('re-classes').innerHTML = `<div class="checks">
      <label class="check allcls"><input type="checkbox" id="re-allcls" ${allCls ? 'checked' : ''}><span><b>전체 반</b> <span class="muted small">나중에 생기는 반도 들어가요</span></span></label>
      ${list.map(c => `<label class="check"><input type="checkbox" data-cls="${esc(c.name)}" ${allCls || cls.has(c.name) ? 'checked' : ''}><span>${esc(c.name)} <span class="muted small">${esc(c.sub)}</span></span></label>`).join('')}
      ${!list.length ? `<div class="muted small">${who === 'student' ? '아직 등록한 학생이 없어요. 전체 반으로 열 수 있어요.' : '모둠 레이스를 하려면 먼저 반·모둠을 등록해 주세요.'}</div>` : ''}</div>`;
    const ac = $('re-allcls');
    /* 전체 반 ticks or clears every class; ticking every class by hand ticks 전체 반, clearing one clears it */
    const boxes = [...$app.querySelectorAll('[data-cls]')];
    ac.onchange = () => { allCls = ac.checked; cls.clear(); boxes.forEach(x => { x.checked = ac.checked; if (ac.checked) cls.add(x.dataset.cls); }); };
    boxes.forEach(x => x.onchange = () => {
      if (x.checked) cls.add(x.dataset.cls); else cls.delete(x.dataset.cls);
      if (allCls && !x.checked) boxes.forEach(y => { if (y.checked) cls.add(y.dataset.cls); });   // leaving 전체 반: keep the other ticked classes
      allCls = ac.checked = boxes.every(y => y.checked);
    });
  };
  $app.querySelectorAll('[name=re-who]').forEach(r => r.onchange = () => { who = r.value; drawClasses(); $('re-once-help').textContent = who === 'student' ? '한 번 끝내면 다시 할 수 없어요.' : '모둠마다 한 번 끝내면 다시 할 수 없어요.'; });

  const current = () => {
    readQ();
    return {
      name: $('re-name').value.trim(),
      sources: [...$app.querySelectorAll('[data-src]:checked')].map(x => x.dataset.src),
      classes: $('re-allcls').checked ? ['*'] : [...$app.querySelectorAll('[data-cls]:checked')].map(x => x.dataset.cls),
      questions: cleanQ(),
      settings: {mode: mode(), who, multi: ($app.querySelector('[name=re-multi]:checked') || {}).value === '1', shuffle: $('re-shuffle').checked,
        scoring: mode() === 'quiz' ? scoring() : 'speed', limit: mode() === 'quiz' && scoring() === 'acc' ? (limPick === 'custom' ? Math.max(1, Math.min(180, +$('re-limit').value || 1)) : limPick) : 0,
        count: cntPick === 'custom' ? Math.max(1, +$('re-count').value || 1) : cntPick,
        penalty: ($app.querySelector('[name=re-penon]:checked') || {}).value === '1' ? Math.max(1, +$('re-pen').value || 3) : 0, rel: $('re-rel').checked, live: $('re-live').checked, showRank: $('re-rank').checked}
    };
  };
  const asRace = c => Object.assign({id: race ? race.id : 'preview', state: race ? race.state : {open: {}}, status: '진행', mine: null}, c);
  const upd = () => {
    const c = current(), quiz = c.settings.mode === 'quiz';
    $('re-words').hidden = quiz; $('re-quiz').hidden = !quiz;
    const acc = quiz && c.settings.scoring === 'acc';
    $('re-limitbox').hidden = !acc; $('re-penbox').hidden = acc;
    const items = raceItems(asRace(c)), all = raceItems(asRace(Object.assign({}, c, {settings: Object.assign({}, c.settings, {count: 0})}))).length;
    $('re-n').innerHTML = quiz ? (c.questions.length ? `Quiz <b>${all}문제</b> 중 <b>${items.length}문제</b>를 내요.` : '') : c.sources.length ? `단어 <b>${all}개</b> 중 <b>${items.length}문제</b>를 모든 ${who === 'student' ? '학생' : '모둠'}에게 같은 순서로 내요.` : '레이스에 쓸 지문을 골라 주세요.';
    $('re-cnt-help').textContent = (quiz ? c.questions.length : c.sources.length) ? (c.settings.count && c.settings.count > all ? `${quiz ? '문제' : '단어'}가 ${all}개뿐이라 ${all}문제로 해요.` : quiz ? (c.settings.shuffle ? `${all}문제 중에서 섞어 뽑아요.` : `앞에서부터 차례로 내요.`) : `고른 지문의 단어 ${all}개 중에서 무작위로 뽑아요.`) : '';
    $('re-prev-n').textContent = `${items.length}문제 · 학생에게 나오는 순서`;
    $('re-prev').innerHTML = items.map(x => quiz ? `<li><div class="qtext small">${x.passage ? '<span class="muted">[지문] </span>' : ''}${esc(x.q)}</div><div class="small">정답: <b>${esc(quizAnswerText(x))}</b>${x.exp ? ` · <span class="muted">해설 있음</span>` : ''}</div></li>` : `<li><b class="en">${esc(x[0])}</b> <span class="muted">${esc(x[1])}</span></li>`).join('') || '<li class="muted">아직 문제가 없어요.</li>';

/* the board: refreshes every 5 seconds, big mode for the classroom screen.
   Each team (student) is ranked by its best finished run; "달리는 중" shows anyone in the middle of a run */
function viewBoard(raceId, cls){
  stopTimers();
  if (needAdmin(() => viewBoard(raceId, cls))) return;
  let big = store.get('wordroom-board-big', false), data = null, confirmKey = '';
  const draw = () => {
    if (!data) return;
    const race = data.race, classes = raceClassNames(race, data.teams);
    const ALLK = '__all', stu = race.settings.who === 'student', acc = isAcc(race);
    const sel = cls && (cls === ALLK || classes.includes(cls)) ? cls : (classes.length > 1 ? ALLK : classes[0] || '');
    const allMode = sel === ALLK;
    const inSel = c => allMode ? classes.includes(c) : c === sel;
    const label = (c, t) => allMode && !stu ? c + ' ' + t : t;
    const teams = data.teams.filter(c => inSel(c.name)).flatMap(c => c.teams.map(t => ({cls: c.name, team: t})));
    const by = {};
    data.rows.filter(r => inSel(r.cls)).forEach(r => { const k = r.cls + '\n' + r.team; (by[k] = by[k] || []).push(r); });
    const ppl = Object.keys(by).map(k => {
      const list = by[k], fin = list.filter(r => r.status === '완료' && r.seconds != null), last = list[list.length - 1];
      const better = (a, b) => acc ? (a.done > b.done || (a.done === b.done && a.seconds < b.seconds)) : a.seconds < b.seconds;
      const best = fin.length ? fin.reduce((a, b) => (better(b, a) ? b : a)) : null;
      return {key: k, cls: last.cls, team: last.team, label: label(last.cls, last.team), best, tries: list.length, last};
    });
    const done = ppl.filter(p => p.best).sort((a, b) => acc ? (b.best.done - a.best.done || a.best.seconds - b.best.seconds) : a.best.seconds - b.best.seconds);
    const run = ppl.filter(p => p.last.status !== '완료').sort((a, b) => b.last.done - a.last.done);
    const wait = teams.filter(t => !by[t.cls + '\n' + t.team]).map(t => label(t.cls, t.team));
    const total = (data.rows[0] && data.rows[0].total) || raceItems(race).length || 1;
    const resetBtn = p => `<button class="link small" data-reset="${esc(p.key)}">${confirmKey === p.key ? '정말 지우기' : '기록 지우기'}</button>`;
    const stNow = allMode ? [...new Set(classes.map(c => raceStatusFor(race, c)))] : [raceStatusFor(race, sel)];
    const oneSt = stNow.length === 1 ? stNow[0] : '';
    $app.classList.toggle('wide', big);
    $app.innerHTML = `${big ? '' : `${header('<button class="link" id="up">← 레이스</button>')}${adminNav('race')}`}
    <div class="board${big ? ' big' : ''}">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div><div class="count">${WHO_NAME[race.settings.who]} · ${MODE_NAME[race.settings.mode]} · ${total}문제${acc ? ` · 정확도${race.settings.limit ? ` · 제한 ${race.settings.limit}분` : ''}` : ''} ${oneSt ? STATUS_CHIP[oneSt] || '' : '<span class="chip run">반마다 다름</span>'}${race.state && race.state.del ? ' <span class="chip">삭제함</span>' : ''}</div><h2>${esc(race.name)}</h2></div>
        <div class="row small"><button class="btn ghost small" id="bbig">${big ? '작게 보기' : '크게 보기 (TV)'}</button>${big ? '' : `
          <button class="btn small mark" data-bst="진행" ${oneSt === '진행' ? 'disabled' : ''}>${allMode ? '모든 반 열기' : '이 반 열기'}</button>
          <button class="btn small ghost" data-bst="마감" ${stNow.includes('진행') ? '' : 'disabled'}>${allMode ? '모든 반 마감' : '이 반 마감'}</button>`}</div>
      </div>
      ${classes.length > 1 ? `<div class="tabs scroll" role="tablist"><button class="tab" data-bcls="${ALLK}" aria-selected="${allMode}">전체 반</button>${classes.map(c => `<button class="tab" data-bcls="${esc(c)}" aria-selected="${c === sel}">${esc(c)}</button>`).join('')}</div>` : `<div class="count">${esc(sel)}</div>`}
      <ol class="rank">${done.map((p, i) => `<li class="r-done"><span class="rk">${i + 1}</span><span class="tm">${esc(p.label)}</span><span class="sec">${acc ? `${p.best.done}/${p.best.total || total} · ${pctOf(p.best.done, p.best.total || total)}` : fmtSec(p.best.seconds)}</span><span class="muted small">${acc ? fmtSec(p.best.seconds) : `틀림 ${p.best.wrong}${p.best.penalty ? ` · +${p.best.penalty}초` : ''}`}${p.tries > 1 ? ` · ${p.tries}번 도전` : ''}</span>${big ? '' : resetBtn(p)}</li>`).join('')}</ol>
      ${run.length ? `<div class="section-label">달리는 중</div><ul class="rank run">${run.map(p => `<li><span class="rk">·</span><span class="tm">${esc(p.label)}</span>${race.settings.live ? `<span class="pbar"><i style="width:${Math.min(100, p.last.done / (p.last.total || total) * 100)}%"></i></span><span class="muted small">${p.last.done}/${p.last.total || total}${acc ? ' 답함' : ''} · ${fmtSec(p.last.elapsed || 0)}</span>` : '<span class="muted small">진행 중</span>'}${big || p.best ? '' : resetBtn(p)}</li>`).join('')}</ul>` : ''}
      ${wait.length ? `<div class="section-label">아직 출발 전 ${wait.length}${stu ? '명' : '모둠'}</div><div class="muted waiting">${wait.map(esc).join(' · ')}</div>` : ''}
      ${!ppl.length && !wait.length ? `<div class="panel empty">${stu ? '이 반에 등록한 학생이 없어요.' : '이 반에 등록된 모둠이 없어요.'}</div>` : ''}
      <div class="muted small">5초마다 새로 고쳐요${race.settings.live ? ' · 실시간 진행 중계 켜짐' : ''}${acc ? ' · 맞힌 개수로 순위 (같으면 빨리 낸 순)' : ''}${race.settings.multi ? ' · 여러 번 도전: 가장 좋은 기록으로 순위' : ''}</div>
    </div>`;
    const up = document.getElementById('up'); if (up) up.onclick = () => { stopTimers(); viewRaceAdmin(); }; bindAdminNavStop();
    document.getElementById('bbig').onclick = () => { big = !big; store.set('wordroom-board-big', big); draw(); };
    $app.querySelectorAll('[data-bst]').forEach(b => b.onclick = () => { b.disabled = true; setRaceStatus(race, allMode ? '*' : sel, b.dataset.bst, load); });
    $app.querySelectorAll('[data-bcls]').forEach(b => b.onclick = () => { cls = b.dataset.bcls; draw(); });
    $app.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
      const key = b.dataset.reset, [rc, team] = key.split('\n');
      if (confirmKey !== key) { confirmKey = key; draw(); return; }
      confirmKey = '';
      try { await api('adminRaceReset', {token: ADMIN.token, race: race.id, cls: rc, team}); toast(`${team} 기록을 지웠어요. 다시 달릴 수 있어요`); await load(); }
      catch(e){ if (!adminErr(e, () => viewBoard(raceId, cls))) toast(e.error || '지우지 못했어요'); }
    });
  };
  const load = async () => {
    try { data = await api('adminBoard', {token: ADMIN.token, race: raceId}); }
    catch(e){ if (adminErr(e, () => viewBoard(raceId, cls))) return; if (!data) { $app.innerHTML = `${header()}<div class="panel empty">${esc(e.error || '불러오지 못했어요')}</div>`; } return; }
    try { draw(); } catch(err){ console.error(err); }
  };
  $app.innerHTML = `${header()}${adminNav('race')}<div class="panel empty">순위판을 불러오는 중…</div>`; bindAdminNavStop();
  load();
  timers.push(setInterval(() => { if (document.hidden) return; load(); }, 5000));
  scrollTo(0, 0);
}
function bindAdminNavStop(){ $app.querySelectorAll('[data-anav]').forEach(b => b.onclick = () => { stopTimers(); ({records: viewAdmin, sets: viewSetsAdmin, race: viewRaceAdmin, qr: () => viewMake(), notice: viewNoticesAdmin, student: () => enterTeacher()})[b.dataset.anav](); }); }
